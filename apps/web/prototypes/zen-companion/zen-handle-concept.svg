<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="880" viewBox="0 0 1120 880" role="img" aria-labelledby="title desc">
  <title id="title">禅模式统一把手：默认、悬停与展开状态</title>
  <desc id="desc">默认隐藏整个把手，包括展开箭头。鼠标悬停于上沿中央触发区或键盘聚焦时，三个独立按钮一起显现。对话收起时位于输入框顶端，对话展开后移至抽屉顶端中央；输入框与抽屉接缝不保留第二组按钮。此图为设计示意，不是运行截图。</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-40%" width="120%" height="190%"><feDropShadow dx="0" dy="3" stdDeviation="7" flood-color="#111827" flood-opacity=".055"/></filter>
    <g id="minus" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M-5 0H5"/></g>
    <g id="up" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m-5 2 5-5 5 5"/></g>
    <g id="down" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m-5-2 5 5 5-5"/></g>
    <g id="maximize" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M-3-6h-3v3M3-6h3v3M6 3v3H3M-3 6h-3V3"/></g>
    <g id="mic" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="-3" y="-7" width="6" height="10" rx="3"/><path d="M-6 0a6 6 0 0 0 12 0M0 6v3M-3 9h6"/></g>
    <g id="composer">
      <rect width="920" height="64" rx="32" fill="#fff" filter="url(#shadow)"/>
      <circle cx="30" cy="32" r="21" fill="#f6f6f6"/>
      <path d="M23 32h14M30 25v14" stroke="#707070" stroke-width="1.8" stroke-linecap="round"/>
      <text x="64" y="38" fill="#b7b7b7" font-size="17">在 Synara 中做任何事</text>
      <g transform="translate(763 32)" color="#8a8a8a"><path d="M-4 5V-3a1.5 1.5 0 0 1 3 0V0V-7a1.5 1.5 0 0 1 3 0V0V-5a1.5 1.5 0 0 1 3 0V2l2-2q3-1 2 2L6 9q-8 5-11-3l-2-4q-1-3 2-2Z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></g>
      <circle cx="815" cy="32" r="8" fill="none" stroke="#5f5f5f" stroke-width="1.4"/>
      <path d="m810 28 10 8m-10 0 10-8" stroke="#5f5f5f" stroke-width="1.1"/>
      <text x="832" y="37" fill="#555" font-size="14">5</text>
      <circle cx="890" cy="32" r="21" fill="#f6f6f6"/>
      <use href="#mic" transform="translate(890 32)" color="#686868"/>
    </g>
    <g id="handle-open">
      <rect x="-63" y="-14" width="126" height="28" rx="14" fill="#ededed"/>
      <path d="M-21-7V7M21-7V7" stroke="#ddd"/>
      <use href="#minus" transform="translate(-42)"/>
      <use href="#maximize" transform="translate(42)"/>
    </g>
  </defs>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">
    <rect width="1120" height="880" rx="20" fill="#f5f5f5"/>
    <text x="64" y="53" font-size="24" font-weight="600" fill="#272727">把窗口操作收进同一个“小把手”</text>
    <text x="64" y="82" font-size="14" fill="#858585">SVG 交互示意 · 修订 02 · 不改动原型 · 模型等输入控件仅作位置示意</text>

    <text x="64" y="132" font-size="16" font-weight="600" fill="#333">01　默认：整个把手隐藏，箭头也不展示</text>
    <g transform="translate(100 166)"><use href="#composer"/></g>
    <text x="560" y="259" text-anchor="middle" font-size="14" fill="#888">没有箭头、胶囊底板或占位标记；上沿中央仅保留不可见触发区。</text>

    <path d="M64 288H1056" stroke="#e3e3e3"/>
    <text x="64" y="329" font-size="16" font-weight="600" fill="#333">02　Hover：三个按钮一起显现于输入框顶端中央</text>
    <g transform="translate(100 377)"><use href="#composer"/></g>
    <g transform="translate(560 377)" color="#696969"><use href="#handle-open"/><use href="#up"/></g>
    <g stroke="#b8b8b8" stroke-width="1" fill="none"><path d="M518 394v22l-100 55"/><path d="M560 394v77"/><path d="M602 394v22l100 55"/></g>
    <g fill="#565656" font-size="14" text-anchor="middle"><text x="404" y="494">收起为气泡</text><text x="560" y="494">展开对话</text><text x="716" y="494">返回主窗口</text></g>
    <text x="560" y="525" text-anchor="middle" font-size="13" fill="#888">键盘聚焦同样显现；按钮间移动保持显示，移出且失焦后整组隐藏。</text>

    <path d="M64 553H1056" stroke="#e3e3e3"/>
    <text x="64" y="594" font-size="16" font-weight="600" fill="#333">03　对话已展开 + Hover：整组移至抽屉顶端中央</text>
    <rect x="128" y="616" width="864" height="116" rx="15" fill="#fff" filter="url(#shadow)"/>
    <text x="152" y="646" font-size="13" fill="#999">原有对话抽屉 · 向上展开</text>
    <rect x="152" y="664" width="554" height="7" rx="3.5" fill="#ededed"/>
    <rect x="152" y="684" width="418" height="7" rx="3.5" fill="#f0f0f0"/>
    <g transform="translate(100 734)"><use href="#composer"/></g>
    <g transform="translate(560 616)" color="#696969"><use href="#handle-open"/><use href="#down"/></g>
    <text x="560" y="831" text-anchor="middle" font-size="14" fill="#777">中间切换为“收起对话”；接缝不留按钮。默认仍整组隐藏，Hover 显现不挤动布局。</text>
  </g>
</svg>
