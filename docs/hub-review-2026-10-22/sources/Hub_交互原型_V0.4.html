const ICONS={hub:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',chat:'<path d="M21 11a8 8 0 0 1-8 8H7l-5 3 1.5-6A8 8 0 1 1 21 11Z"/>',folder:'<path d="M3 7V5a2 2 0 0 1 2-2h5l2 3h7a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/>',check:'<path d="m5 12 4 4L19 6"/>',chevron:'<path d="m9 5 7 7-7 7"/>',down:'<path d="m6 9 6 6 6-6"/>',plus:'<path d="M12 5v14M5 12h14"/>',x:'<path d="m6 6 12 12M18 6 6 18"/>',arrow:'<path d="M5 12h14m-6-6 6 6-6 6"/>',back:'<path d="M19 12H5m6-6-6 6 6 6"/>',up:'<path d="M12 19V5m-6 6 6-6 6 6"/>',team:'<circle cx="9" cy="8" r="3"/><path d="M3 21v-3a6 6 0 0 1 12 0v3M16 5a3 3 0 0 1 0 6m2 3a5 5 0 0 1 3 4v3"/>',user:'<circle cx="12" cy="8" r="3.5"/><path d="M5 21v-2a7 7 0 0 1 14 0v2"/>',file:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6M8 13h8m-8 4h6"/>',search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/>',settings:'<path d="m9 3-.6 3-2.9 1-2.5-1.4L1.5 9l2.2 2v3l-2.2 2 1.5 3.4L5.5 18l2.9 1 .6 3h4l.6-3 2.9-1 2.5 1.4 1.5-3.4-2.2-2v-3l2.2-2L19 5.6 16.5 7l-2.9-1L13 3Z"/><circle cx="11" cy="12.5" r="3"/>',dots:'<circle cx="5" cy="12" r=".8" fill="currentColor"/><circle cx="12" cy="12" r=".8" fill="currentColor"/><circle cx="19" cy="12" r=".8" fill="currentColor"/>',lock:'<rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 5v2"/>',pause:'<path d="M8 5v14M16 5v14"/>',play:'<path d="m7 4 14 8-14 8Z"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',spark:'<path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5Z"/>',list:'<path d="M9 6h12M9 12h12M9 18h12M3 6h.01M3 12h.01M3 18h.01"/>',branch:'<circle cx="6" cy="5" r="2"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="6" r="2"/><path d="M6 7v10m0-4h6a6 6 0 0 0 6-5"/>',book:'<path d="M3 4h6a3 3 0 0 1 3 3v14a3 3 0 0 0-3-3H3Zm18 0h-6a3 3 0 0 0-3 3v14a3 3 0 0 1 3-3h6Z"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10h.01"/>',copy:'<rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V3H3v13h5"/>',archive:'<path d="M4 8v13h16V8M3 3h18v5H3Zm6 9h6"/>',brain:'<path d="M12 5c-2-5-7-3-7 1-5 1-4 7-1 8-2 5 4 8 8 5m0-14c2-5 7-3 7 1 5 1 4 7 1 8 2 5-4 8-8 5V5"/>',tool:'<path d="m13 6 5 5M4 20l7-7m1-8a6 6 0 0 0-2 7L3 19l2 2 7-7a6 6 0 0 0 7-2 6 6 0 0 0 1-6l-4 4-3-3 4-4a6 6 0 0 0-5 2Z"/>',bell:'<path d="M4 17h16l-2-4V9a6 6 0 0 0-12 0v4Zm6 3h4"/>',code:'<path d="m8 6-6 6 6 6m8-12 6 6-6 6m-3-15-2 18"/>'};
const I=(n)=>`<svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]||ICONS.hub}</svg>`;
const E=(s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ib=(name,act,label)=>`<button class="iconbtn" data-act="${act}" aria-label="${label}" title="${label}">${I(name)}</button>`;
const experts=[{id:'pm',name:'产品经理',short:'产',desc:'需求探索、产品方案与优先级判断',skills:3},{id:'tech',name:'技术评审',short:'审',desc:'可行性、架构约束与实现风险',skills:2},{id:'dev',name:'开发工程师',short:'研',desc:'代码实现、调试与本地验证',skills:4},{id:'design',name:'交互设计师',short:'设',desc:'用户流程、交互方案与界面设计',skills:3},{id:'research',name:'研究助理',short:'研',desc:'资料检索、证据整理与研究写作',skills:2},{id:'data',name:'数据分析师',short:'析',desc:'数据清洗、分析与可视化',skills:2,unavailable:'数据工具未连接'}];
const defaults=[{id:'product',name:'产品协作团',purpose:'从需求共创、方案评审到产品实现',members:['pm','tech','dev'],templates:['方案共创与评审'],revision:1},{id:'research',name:'研究写作团',purpose:'资料研究、论证与报告写作',members:['research','pm'],templates:['研究与交叉评审'],revision:1}];
const load=(k,f)=>{try{return JSON.parse(localStorage.getItem(k))||f}catch{return f}};
let teams=load('hub-v04-teams',structuredClone(defaults));
let S={page:'hub',tab:'teams',editor:null,hub:{name:'Linx 产品方案',mode:'team',purpose:defaults[0].purpose,members:['pm','tech','dev'],source:'Linx',teamId:'product',teamRevision:1,templates:['方案共创与评审']},run:'draft',scope:'all',planRev:1,outputRev:2,expanded:false,thread:null,inspector:null,menu:false,returning:false,returnText:'',reply:'',threadMsgs:[],pausedFrom:null,modal:null,instanceTab:'general',search:'',stageReplies:[],onlyOne:false,newHub:false};
let createDraft=null,instanceDraft=null,editorDirty=false,previousFocus=null;
const saveTeams=()=>{try{localStorage.setItem('hub-v04-teams',JSON.stringify(teams))}catch{toast('当前浏览器不支持本地保存，配置只保留在本次页面中。')}};
const expert=(id)=>experts.find(x=>x.id===id);
const names=(ids)=>ids.map(id=>expert(id)?.name||'不可用专家').join(' · ');
const chips=(ids,removable=false)=>ids.map(id=>`<span class="chip"><span>${E(expert(id)?.name||id)}</span>${removable?ib('x','member-remove:'+id,'移除'+(expert(id)?.name||id)):''}</span>`).join('');
const runLabels={empty:'未开始',draft:'待确认',cocreate:'等待补充',reviewing:'审核中',gate:'待你确认',develop:'开发中',done:'已完成',paused:'已暂停',blocked:'需要处理'};
function protoTop(){return `<div class="proto-top"><div class="proto-brand"><strong>LINX / HUB</strong><span>交互原型 V0.4</span></div><nav class="proto-links" aria-label="原型场景"><button data-act="demo-create" class="${S.modal==='create'?'current':''}">01 创建 Hub</button><button data-act="settings-teams" class="${S.page==='settings'?'current':''}">02 专家团设置</button><button data-act="demo-work" class="${S.page==='hub'&&!S.modal?'current':''}">03 协作过程</button><button data-act="help">设计说明</button></nav><span class="prototype-note">本地模拟 · 不调用 Agent · 不修改仓库</span></div>`}
function rail(){return `<aside class="rail" aria-label="应用导航"><div class="mark">S</div><button data-act="scope-note" title="现有聊天入口">${I('chat')}</button><button data-act="scope-note" title="现有项目入口">${I('folder')}</button><button class="${S.page==='hub'?'active':''}" data-act="to-hub" title="Hubs">${I('hub')}</button><button data-act="scope-note" title="现有任务入口">${I('list')}</button><div class="space"></div><button data-act="settings-teams" class="${S.page==='settings'?'active':''}" title="设置">${I('settings')}</button></aside>`}
function side(){if(S.page==='settings')return `<aside class="side"><div class="side-heading">设置</div><button class="navrow" data-act="to-hub">${I('back')}返回 Hub</button><div class="side-label">个人</div>${[['settings','通用'],['user','个人资料'],['spark','外观'],['bell','通知']].map(([i,n])=>`<button class="navrow" data-act="existing-setting:${n}">${I(i)}${n}</button>`).join('')}<div class="side-label">能力与工具</div>${[['code','Agent 提供商'],['brain','模型'],['book','技能']].map(([i,n])=>`<button class="navrow" data-act="existing-setting:${n}">${I(i)}${n}</button>`).join('')}<button class="navrow active" data-act="settings-teams">${I('team')}专家</button><button class="navrow" data-act="existing-setting:MCP">${I('tool')}MCP</button><div class="workspace-footer"><span class="avatar">L</span><span>个人工作区</span></div></aside>`;
 const active=!['empty','draft','blocked'].includes(S.run);const showReview=!S.onlyOne&&(['reviewing','gate','develop','done'].includes(S.run)||S.outputRev>2||S.pausedFrom==='reviewing');
 return `<aside class="side"><div class="side-heading between">Hubs <span class="muted small">2</span></div><button class="newhub" data-act="create">${I('plus')}新建 Hub</button><div class="side-label">工作空间</div><div class="group-header">${I(S.hub.mode==='team'?'team':'hub')}<span class="grow">${E(S.hub.name)}</span>${S.run==='gate'||S.run==='cocreate'?'<span class="dot amber"></span>':''}</div><button class="navrow threadrow ${!S.thread?'active':''}" data-act="to-hub">${I('chat')}主对话</button>${active&&S.hub.mode==='team'?`<button class="navrow threadrow ${S.thread==='pm'?'active':''}" data-act="thread:pm">${I('chat')}需求共创 ${S.run==='cocreate'?'<span class="badge-count">待回复</span>':''}</button>${showReview?`<button class="navrow threadrow ${S.thread==='tech'?'active':''}" data-act="thread:tech">${I('chat')}技术审核</button>`:''}${['develop','done'].includes(S.run)?`<button class="navrow threadrow ${S.thread==='dev'?'active':''}" data-act="thread:dev">${I('chat')}本地开发</button>`:''}`:''}<div class="nav-divider"></div><button class="navrow" data-act="ordinary-hub">${I('hub')}日常工作</button><div class="workspace-footer"><span class="avatar">L</span><span class="grow">个人工作区</span>${I('down')}</div></aside>`}
function topbar(){return `<header class="topbar"><div class="crumb"><span>${E(S.hub.name)}</span><span class="tag">${S.hub.mode==='team'?'专家团':'普通'}</span>${S.hub.source?`<span class="slash source-crumb">/</span><span class="muted source-crumb">${E(S.hub.source)}</span>`:''}</div><div class="row"><button class="btn ghost small" data-act="library">${I('file')}成果</button>${ib('settings','hub-settings','当前 Hub 设置')}${ib('dots','hub-menu','更多操作')}</div></header>`}
const sender=(who,short,source='')=>`<div class="sender"><span class="avatar">${short}</span>${E(who)}${source?`<span class="source">${E(source)}</span>`:''}</div>`;
function welcome(){return `<div class="welcome"><div class="large-symbol">${I(S.hub.mode==='team'?'team':'hub')}</div><h1>${E(S.hub.name)}</h1><p>${S.hub.mode==='team'?E(S.hub.purpose||'向团队提出需求，从讨论开始，也可以委托一项工作。'):'讨论问题、整理思路，或委托一项具体工作。'}</p>${S.hub.mode==='team'?`<div class="chips" style="justify-content:center;margin-bottom:26px">${chips(S.hub.members)}</div>`:''}<div class="suggestions"><button data-act="suggest:discussion">先讨论一个产品想法 ${I('arrow')}</button><button data-act="suggest:plan">完善方案，审核后再开发 ${I('arrow')}</button></div></div>`}
function planCard(){if(S.hub.mode==='standard')return standardPlanCard();let r=S.run, paused=r==='paused',blocked=r==='blocked';let pass=['gate','develop','done'].includes(r),dev=['develop','done'].includes(r),finished=r==='done';let author=['gate','develop','done','reviewing'].includes(r), reviewer=pass;let title=S.hub.mode==='team'?'产品方案与本地开发':'整理产品方案';
 let status=r==='gate'?'等待你确认方案':runLabels[r];if(paused)status='已暂停';
 let body=`<article class="card" aria-label="执行计划工作卡"><div class="card-header between"><div><h3>${title}</h3><div class="meta">计划 v${S.planRev} · ${S.scope==='phase'?'仅授权方案阶段':'仅本地开发，不发布上线'}</div></div><span class="tag ${['draft','cocreate','gate','blocked'].includes(r)?'amber':['reviewing','develop','done'].includes(r)?'green':''}">${status}</span></div><div class="planbody"><section class="stage"><div class="stage-header"><div class="stepdot ${pass?'done':'current'}">${pass?I('check'):'1'}</div><div class="grow"><div class="stage-title">${S.hub.mode==='team'?'方案形成与审核':'形成方案'}</div><div class="stage-sub">${S.hub.mode==='team'?'产品经理 · 人机共创　／　技术评审 · Agent 主导':'普通工作线程 · Agent 主导'}</div></div><div class="stage-status ${r==='reviewing'?'live':r==='cocreate'?'wait':''}">${pass?'审核通过':r==='reviewing'?'技术评审中':r==='cocreate'?'等你补充':r==='draft'?'未开始':paused?'已暂停':blocked?'能力缺失':''}</div>${ib(S.expanded?'down':'chevron','expand-stage',S.expanded?'收起协作详情':'展开协作详情')}</div>${S.expanded?`<div class="stage-detail"><div class="worker"><span class="avatar">产</span><button class="inline-link" data-act="thread:pm">产品经理 · 需求共创</button><span class="muted">${author?'已提交方案':r==='cocreate'?'等待必要输入':'等待开始'}</span></div><div class="arrowtext">提交候选版本 → 审核；需修改 → 返回原线程</div><div class="worker"><span class="avatar">审</span><button class="inline-link" data-act="thread:tech">技术评审 · 可行性审核</button><span class="muted">${reviewer?'通过':r==='reviewing'?'正在审核':'等待方案'}</span></div></div>`:''}</section>`;
 if(pass){body+=`<div class="outputs" style="margin:0 0 14px 34px"><button class="filepill" data-act="artifact:prd">${I('file')}需求方案.md <span>v${S.outputRev}</span></button><button class="filepill" data-act="artifact:review">${I('file')}技术评审 <span>v1</span></button></div>`}
 if(r==='gate'){body+=`<div class="decision"><div class="title">请确认需求方案 v${S.outputRev}</div><div class="detail">${S.scope==='phase'?'确认后完成本次委托，不启动开发。':'确认后，开发工程师将使用此版本开始本地开发。'}</div></div>`}
 if(!dev&&S.scope!=='phase'&&r!=='gate')body+=`<div class="gate-line">${I('lock')}方案审核通过后，需你确认才能进入开发</div>`;
 if(S.scope!=='phase')body+=`<section class="stage ${!dev?'dim':''}"><div class="stage-header"><div class="stepdot ${finished?'done':dev?'current':''}">${finished?I('check'):'2'}</div><div class="grow"><div class="stage-title">本地开发与验证</div><div class="stage-sub">开发工程师 · 使用确认后的方案</div></div><span class="stage-status ${r==='develop'?'live':''}">${finished?'已完成':r==='develop'?'开发中':'等待方案放行'}</span>${dev?ib('chevron','thread:dev','进入开发线程'):''}</div></section>`;
 if(blocked)body+=`<div class="hintbox" style="margin:5px 0 12px">当前成员无法完成本次技术审核。调整成员或修改计划后再确认，不自动改用普通线程。</div>`;
 if(finished)body+=`<div class="outputs" style="margin:0 0 14px 34px"><button class="filepill" data-act="artifact:result">${I('code')}${S.scope==='phase'?'方案交付摘要':'本地交付摘要'} <span>查看</span></button></div>`;
 body+='</div>';
 if(S.returning)body+=`<div class="gate-return"><label class="label" for="return-text">需要修改什么？</label><textarea id="return-text" placeholder="例如：首版先不做多人协作，聚焦个人工作台。">${E(S.returnText)}</textarea><div class="row"><button class="btn ghost small" data-act="cancel-return">取消</button><button class="btn primary small" data-act="send-return">发送修改意见</button></div></div>`;
 let actions='';
 if(r==='draft')actions=`<button class="btn primary" data-act="confirm-plan">确认执行 ${I('arrow')}</button><button class="btn ghost" data-act="adjust-plan">调整计划</button><button class="inline-link" data-act="plan-details" style="margin-left:auto">计划详情</button>`;
 if(r==='cocreate')actions=`<button class="btn primary" data-act="thread:pm">去回答 ${I('arrow')}</button><span class="footnote">产品经理需要你明确目标用户</span>`;
 if(r==='reviewing')actions=`<span class="small muted">${I('clock')} 专家正在审核，无需你操作</span><button class="inline-link" data-act="thread:tech" style="margin-left:auto">查看审核线程</button>`;
 if(r==='gate'&&!S.returning)actions=`<button class="btn primary" data-act="approve-gate">${S.scope==='phase'?'确认并完成':'确认并进入开发'} ${I('arrow')}</button><button class="btn ghost" data-act="return-gate">退回修改</button>`;
 if(r==='develop')actions=`<span class="small muted">${I('clock')} 按需求方案 v${S.outputRev} 执行</span><button class="inline-link" data-act="thread:dev" style="margin-left:auto">查看开发线程</button>`;
 if(paused)actions=`<button class="btn primary" data-act="resume">恢复执行</button><span class="footnote">未启动新的工作，保留当前进度</span>`;
 if(blocked)actions=`<button class="btn primary" data-act="hub-members">调整参与专家</button><button class="btn ghost" data-act="adjust-plan">修改计划</button>`;
 if(finished)actions=`<span class="small muted">${I('check')} ${S.scope==='phase'?'方案阶段已完成，未启动开发':'本次工作已完成，未发布上线'}</span><button class="inline-link" data-act="artifact:result" style="margin-left:auto">查看成果</button>`;
 if(actions)body+=`<div class="card-actions">${actions}</div>`;return body+'</article>';
}

function standardPlanCard(){const r=S.run;const done=r==='done';let btn=r==='draft'?`<button class="btn primary" data-act="confirm-plan">确认执行 ${I('arrow')}</button>`:r==='gate'?`<button class="btn primary" data-act="approve-gate">确认完成</button><button class="btn ghost" data-act="return-gate">退回修改</button>`:r==='paused'?`<button class="btn primary" data-act="resume">恢复执行</button>`:`<span class="muted small">${done?'已完成':'普通工作线程正在执行'}</span><button class="inline-link" data-act="thread:general" style="margin-left:auto">查看线程</button>`;return `<article class="card"><div class="card-header between"><div><h3>整理产品方案</h3><div class="meta">计划 v${S.planRev} · 单项工作，不包含开发</div></div><span class="tag ${r==='gate'?'amber':''}">${r==='reviewing'?'执行中':runLabels[r]}</span></div><div class="planbody"><section class="stage"><div class="stage-header"><div class="stepdot ${done?'done':'current'}">${done?I('check'):'1'}</div><div><div class="stage-title">分析需求，形成方案</div><div class="stage-sub">普通工作线程 · 沿用 Hub 默认配置</div></div></div></section>${r==='gate'||done?`<div class="outputs" style="margin:0 0 18px 34px"><button class="filepill" data-act="artifact:prd">${I('file')}方案草稿 <span>v${S.outputRev}</span></button></div>`:''}${S.returning?`<div class="gate-return"><textarea id="return-text" placeholder="填写修改意见">${E(S.returnText)}</textarea><button class="btn small" data-act="send-return">发送修改意见</button></div>`:''}</div><div class="card-actions">${btn}</div></article>`}
function generalThread(){return `<div class="conversation"><div class="route-banner between"><span>普通工作线程 · 沿用 Hub 默认配置</span><button data-act="to-hub">返回 Hub</button></div><div class="threadtitle"><h2>方案讨论</h2><p>未绑定专业 Expert，不显示虚构的专家身份。</p></div><div class="message ai">${sender('工作线程','H')}<div class="body">${S.onlyOne?'我们先讨论使用场景和需求，不启动正式执行。':'正在按已确认范围整理方案，不自动进入开发。'}</div></div>${S.threadMsgs.map(t=>`<div class="message user"><div class="bubble">${E(t)}</div></div>`).join('')}</div>`}

function hubConversation(){if(S.run==='empty')return welcome();if(S.onlyOne)return `<div class="conversation"><div class="route-banner between"><span>专业讨论 · 尚未创建正式执行计划</span><button data-act="start-from-discussion">制定执行计划</button></div><div class="message ai">${sender(S.hub.mode==='team'?'产品经理':'Hub',S.hub.mode==='team'?'产':'H')}<div class="body">我们先聚焦需求和范围。当前只进行讨论，不会自动进入后续执行。<div style="margin-top:8px"><button class="inline-link" data-act="thread:${S.hub.mode==='team'?'pm':'general'}">进入对应线程</button></div></div></div>${S.threadMsgs.map(t=>`<div class="message user"><div class="bubble">${E(t)}</div></div>`).join('')}</div>`;
 let text=S.hub.mode==='team'?'和产品经理一起完善方案，请技术专家审核。我确认方案后，再让开发工程师实现。暂不发布上线。':'帮我整理一份产品方案，先给我看计划。';
 let intro=S.run==='draft'?'我安排了以下工作。方案通过技术审核后，会停下来等你确认。':S.run==='done'?'本次委托已完成。成果和关键决定已保留在这份工作中。':S.run==='paused'?'计划已暂停，当前工作记录保留。恢复前不会继续派发。':S.run==='gate'?'方案和审核结果已就绪。是否进入下一阶段，由你决定。':'工作按已确认计划推进。需要你补充或决定时，会在这里提示。';
 return `<div class="conversation">${S.newHub?'<div class="pending-strip">当前 Hub 已创建。以下为你在本地原型中发起的演示工作。</div>':''}<div class="message user"><div class="bubble">${text}</div></div><div class="message ai">${sender('Hub','H','协调')}${['draft','gate','done'].includes(S.run)?'':`<div class="body">${S.hub.mode==='standard'?'按已确认范围执行，不自动进入开发。':intro}</div>`}</div>${planCard()}${S.run==='cocreate'&&S.hub.mode==='team'?`<div class="message ai">${sender('产品经理','产','需求共创线程')}<div class="body">${S.returnText?'收到修改意见。我会在原方案上修订，并再次提交技术审核。':'首版优先服务个人用户，还是小型团队？这个选择会影响首版范围。'}<div style="margin-top:8px"><button class="inline-link" data-act="thread:pm">进入需求共创线程 ${I('arrow')}</button></div></div></div>`:''}${S.stageReplies.map(t=>`<div class="message user"><div class="bubble">${E(t)}</div></div>`).join('')}</div>`;
}
function threadView(){if(S.thread==='general')return generalThread();let who=S.thread, name=expert(who)?.name||'专家',title={pm:'需求共创',tech:'技术审核',dev:'本地开发'}[who];let content=who==='pm'?`<div class="message ai">${sender(name,expert(who).short)}<div class="body">${S.run==='cocreate'?'我们先明确首版的使用者和范围。你更希望先服务个人用户，还是小型团队？':'已将需求整理为候选方案。后续修改会继续使用当前线程，并保留已确认的决定。'}</div></div>${S.threadMsgs.map(t=>`<div class="message user"><div class="bubble">${E(t)}</div></div>`).join('')}${S.returnText?`<div class="review-feedback"><b>本轮修改要求</b><br>${E(S.returnText)}</div>`:''}`:who==='tech'?`<div class="message ai">${sender(name,'审')}<div class="body">${['gate','develop','done'].includes(S.run)?`已审核需求方案 v${S.outputRev}，技术上可行。<div class="review-feedback"><b>审核通过</b><br>保留两项实施提醒：明确本地文件访问边界；恢复执行时避免重复写入。</div>`:'正在核对方案范围、实现成本与权限边界。专业疑问将直接回到作者线程澄清。'}<div class="outputs"><button class="filepill" data-act="artifact:prd">${I('file')}本次输入：需求方案 <span>v${S.outputRev}</span></button></div></div></div>`:`<div class="message ai">${sender(name,'研')}<div class="body">依据已确认的需求方案 v${S.outputRev}，进行本地实现与验证。发布上线不在本次授权范围。${S.run==='done'?'<div class="review-feedback">本地实现与测试已完成。此处是演示结果，不是实际代码执行。</div>':''}</div></div>`;
 return `<div class="conversation"><div class="route-banner between"><span>来自「产品方案与本地开发」 · ${who==='dev'?'开发阶段':'方案形成与审核'}</span><button data-act="to-hub">返回 Hub</button></div><div class="threadtitle"><h2>${name} · ${title}</h2><p>沿用专业线程历史；本次计划、输入和决定由系统关联。</p></div>${content}</div>`;
}
function composer(){let target=S.thread?(expert(S.thread)?.name||'工作线程'):S.run==='cocreate'&&S.hub.mode==='team'?'产品经理':'Hub';return `<div class="composer-wrap">${S.thread||S.run==='cocreate'?`<div class="composer-context"><span>回复 ${E(target)} · ${S.thread==='tech'?'技术审核':S.thread==='dev'?'本地开发':'需求共创'}</span><span>关联当前工作</span></div>`:''}<form id="composer" class="composer"><textarea id="chat-input" aria-label="发送给${target}" placeholder="${S.run==='empty'?'描述你想讨论或完成的工作…':S.run==='cocreate'?'例如：先面向个人用户，只做本地工作台。':'补充要求，或讨论下一项工作…'}" rows="2"></textarea><div class="composer-bottom"><div class="row">${ib('plus','attach-note','引用资料')}<span class="small">${S.hub.source?E(S.hub.source)+' 项目背景':'Hub 共享背景'}</span></div><button class="send" type="submit" aria-label="发送">${I('up')}</button></div></form></div>`}
function menu(){return S.menu?`<div class="menu"><button data-act="hub-settings">Hub 设置</button><button data-act="save-preset">保存为专家团配置</button><button data-act="${S.run==='paused'?'resume':'pause'}">${S.run==='paused'?'恢复执行':'暂停当前计划'}</button><button data-act="reset-work">重新演示当前流程</button></div>`:''}
function inspector(){if(!S.inspector)return '';let type=S.inspector,title=type==='library'?'成果':type==='plan'?'计划详情':type==='prd'?'需求方案.md':type==='review'?'技术评审':'交付摘要';let inner='';
 if(type==='library')inner=`<p class="muted small">沿用 Hub 成果库入口，按工作归属查看。</p>${['gate','develop','done'].includes(S.run)?`<button class="doc-link" data-act="artifact:prd">${I('file')}需求方案.md<span class="muted" style="margin-left:auto">v${S.outputRev}</span></button><button class="doc-link" data-act="artifact:review">${I('file')}技术评审<span class="muted" style="margin-left:auto">v1</span></button>${S.run==='done'?'<button class="doc-link" data-act="artifact:result">本地交付摘要</button>':''}`:'<div class="empty-small">尚无正式交付成果。</div>'}`;
 else if(type==='plan')inner=`<span class="tag">计划 v${S.planRev}</span><h2>产品方案与本地开发</h2><p>由产品经理与用户明确需求，经过技术审核和用户放行后，进入本地开发。</p><div class="mini-graph"><div class="graphnode current">方案形成与审核<span class="muted">产品经理 ⇄ 技术评审 · 最多 2 次自动返工</span></div><span class="g-arrow">↓</span><div class="graphnode gate">用户确认具体方案版本</div><span class="g-arrow">↓</span><div class="graphnode">本地开发与验证<span class="muted">开发工程师 · 读取已确认版本</span></div></div><div class="props-row"><span class="muted">授权范围</span><span>${S.scope==='phase'?'仅方案阶段':'方案与本地开发'}</span></div><div class="props-row"><span class="muted">不包含</span><span>发布上线、外部写入</span></div><div class="props-row"><span class="muted">参考方法</span><span>方案共创与评审</span></div><p class="small">模板仅作为规划参考。本次计划及审批记录决定实际执行。</p>`;
 else if(type==='prd')inner=`<span class="tag green">v${S.outputRev} · ${['develop','done'].includes(S.run)?'用户已确认':'待用户确认'}</span><h2>Linx 个人工作台方案</h2><p class="small">原型演示文档，不代表仓库真实产出。</p><h3>目标</h3><p>帮助个人围绕项目组织工作，通过 Hub 将明确的工作交给专业 Agent。</p><h3>首版范围</h3><ul><li>创建普通 Hub 或专家团 Hub。</li><li>用户确认计划后执行。</li><li>方案共创、技术审核、人工放行。</li><li>使用既有专业线程和成果入口。</li></ul><h3>不包含</h3><p>自动发布、完整工作流编辑器、跨 Hub 共享对话。</p><h3>人工检查点</h3><p>方案和审核结果就绪后，由用户确认具体版本，再启动开发。</p>`;
 else if(type==='review')inner=`<span class="tag green">审核通过</span><h2>技术可行性评审</h2><p>审核对象：需求方案 v${S.outputRev}。这是原型中的模拟结论。</p><h3>可复用基础</h3><p>Hub 成员选择、专业线程、Context 快照、成果库与工作项卡片。</p><h3>待补充</h3><p>专家团预设、显式模式、计划版本确认、组合阶段人工放行。</p><h3>实施提醒</h3><p>避免新增另一套任务状态；预设调整不覆盖已创建 Hub；输入与授权必须关联具体版本。</p>`;
 else inner=`<span class="tag green">本次委托完成</span><h2>交付摘要</h2><p>方案与技术评审已保留。${S.scope==='phase'?'本次仅执行方案阶段，没有启动开发。':'本地开发与验证已在此原型中模拟完成，没有执行发布。'}</p><p>实际生产环境应展示文件、变更、验证结果和真实执行记录。</p><div class="hintbox">这里是交互演示，不连接模型、文件工作区或真实执行器。</div>`;
 return `<aside class="inspect" aria-label="${title}"><div class="inspect-head"><h3>${title}</h3>${ib('x','close-inspector','关闭详情')}</div><div class="inspect-body">${inner}</div></aside>`;
}
function teamList(){const data=teams.filter(t=>!t.archived&&(!S.search||(t.name+t.purpose).includes(S.search)));return `<div class="list-toolbar"><div class="searchbox">${I('search')}<input id="team-search" aria-label="搜索专家团" placeholder="搜索专家团" value="${E(S.search)}"></div><button class="btn primary" data-act="new-team">${I('plus')}新建专家团</button></div><div class="listrows">${data.length?data.map(t=>`<div class="listitem"><span class="avatar lg">${I('team')}</span><button class="listitem-main" data-act="edit-team:${t.id}"><div class="listitem-title">${E(t.name)} <span class="muted small" style="font-weight:400;margin-left:5px">v${t.revision}</span></div><div class="listitem-desc">${E(t.purpose||'未设置用途')}</div><div class="listitem-members">${t.members.map(id=>`<span>${E(expert(id)?.name||'成员不可用')}</span>`).join('')}</div></button><div class="listitem-buttons"><button class="btn small" data-act="use-team:${t.id}">创建 Hub</button>${ib('copy','copy-team:'+t.id,'复制专家团')}${ib('archive','archive-team:'+t.id,'归档专家团')}</div></div>`).join(''):'<div class="empty-small">暂无匹配的专家团。可新建，也可在创建 Hub 时临时选择专家。</div>'}</div><p class="list-note">复用成员与协作偏好，不包含 Hub 对话、项目资料或执行授权。</p>`}
function singleExperts(){return `<div class="list-toolbar"><p class="muted small">沿用已有专家列表与编辑器</p><button class="btn" data-act="expert-editor:new">${I('plus')}新建专家</button></div><div class="listrows">${experts.map(x=>`<div class="listitem"><span class="avatar lg">${x.short}</span><button class="listitem-main" data-act="expert-editor:${x.id}"><div class="listitem-title">${x.name}</div><div class="listitem-desc">${x.desc}</div></button><span class="tag ${x.unavailable?'amber':''}">${x.unavailable||x.skills+' 项技能'}</span>${ib('chevron','expert-editor:'+x.id,'查看'+x.name)}</div>`).join('')}</div>`}
function memberOptions(members,prefix='edit'){return experts.map(x=>`<label class="member-option ${prefix==='create'?'compact':''}"><input type="checkbox" data-members="${prefix}" value="${x.id}" ${members.includes(x.id)?'checked':''}><span class="avatar">${x.short}</span><span class="grow"><b>${x.name}</b><span class="desc">${x.desc}</span></span>${x.unavailable?`<span class="tag amber">工具未连接</span>`:''}</label>`).join('')}
function teamEditor(){const t=S.editor;return `<div class="editor-head"><div class="row">${ib('back','back-teams','返回专家团列表')}<h2>${t.id?'编辑专家团':'新建专家团'}</h2>${t.id?`<span class="muted small">v${t.revision}</span>`:''}</div><button class="btn primary" data-act="save-team" id="save-team">保存</button></div><div class="editor-form"><div class="field"><label for="team-name">名称</label><input id="team-name" maxlength="80" placeholder="例如：产品协作团" value="${E(t.name)}"></div><div class="field"><label for="team-purpose">用途 <span class="muted" style="font-weight:400">· 可选</span></label><input id="team-purpose" maxlength="600" placeholder="这支团队主要帮助你完成什么？" value="${E(t.purpose)}"></div><div class="field"><div class="between"><label class="label" style="margin:0">成员</label><span id="member-count" class="muted small">${t.members.length} 位</span></div><div class="member-picker">${memberOptions(t.members)}</div><div class="hint">只选择已有 Expert，不在这里重复配置角色、技能和工具。</div></div><details ${t.templates?.length?'open':''}><summary>${I('chevron')}协作偏好 <span class="muted">· 可选</span></summary><div class="details-body"><label class="label">优先参考的协作模板</label>${['方案共创与评审','研究与交叉评审'].map(n=>`<label class="template-row"><input type="checkbox" data-template="${n}" ${t.templates.includes(n)?'checked':''}><div>${n}<p>Hub 可按需求裁剪或重新设计任务 Graph</p></div></label>`).join('')}</div></details><p class="saved-policy">保存只影响后续使用这份配置创建的 Hub。现有 Hub 不会自动更新。</p><div id="team-error" class="error" role="alert"></div></div>`}
function settings(){return `<main class="main"><header class="topbar"><div class="crumb"><span class="muted">设置</span><span class="slash">/</span><span>专家</span></div><button class="btn ghost small" data-act="to-hub">返回工作 ${I('arrow')}</button></header><div class="settings-body"><div class="settings-content">${S.editor?teamEditor():`<div class="page-heading"><h1>专家</h1></div><div class="tabs" role="tablist" aria-label="专家设置分类"><button role="tab" aria-selected="${S.tab==='experts'}" class="${S.tab==='experts'?'active':''}" data-act="tab:experts">单个专家</button><button role="tab" aria-selected="${S.tab==='teams'}" class="${S.tab==='teams'?'active':''}" data-act="tab:teams">专家团</button></div>${S.tab==='teams'?teamList():singleExperts()}`}</div></div></main>`}
function bottom(){return `<div class="proto-bottom"><span>演示状态</span>${[['draft','计划确认'],['cocreate','需求共创'],['reviewing','技术审核'],['gate','人工放行'],['develop','开发'],['done','完成']].map(([k,n])=>`<button data-act="demo-state:${k}" class="${S.run===k?'active':''}">${n}</button>`).join('')}<span class="spacer"></span><span class="small">此栏用于切换模拟场景，不属于正式产品</span><button data-act="help">说明 ${I('info')}</button></div>`}
function render(){const main=S.page==='settings'?settings():`<main class="main">${topbar()}<div class="hubbody">${S.thread?threadView():hubConversation()}</div>${composer()}${menu()}${inspector()}</main>`;document.getElementById('app').innerHTML=protoTop()+`<div class="shell">${rail()}${side()}${main}</div>`+bottom();bindForms();}
function toast(t){const root=document.getElementById('toast-root');root.innerHTML=`<div class="toast">${E(t)}</div>`;clearTimeout(toast.timer);toast.timer=setTimeout(()=>root.innerHTML='',3500)}
function openDialog(html,cls=''){previousFocus=document.activeElement;document.getElementById('modal-root').innerHTML=`<dialog id="dialog" class="${cls}">${html}</dialog>`;const d=document.getElementById('dialog');d.showModal();d.addEventListener('cancel',e=>{e.preventDefault();closeDialog()});d.addEventListener('click',e=>{if(e.target===d){let r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeDialog()}})}
function closeDialog(){document.getElementById('dialog')?.close();document.getElementById('modal-root').innerHTML='';S.modal=null;previousFocus?.focus?.();}
function createModal(preset=null,keep=false){if(!keep){let t=preset?teams.find(x=>x.id===preset):null;createDraft={mode:t?'team':'standard',name:t?t.name+' Hub':'',purpose:t?.purpose||'',teamId:t?.id||'',teamRevision:t?.revision||null,members:t?[...t.members]:[],templates:t?[...t.templates]:[],source:'',custom:false,picker:false};}S.modal='create';const d=createDraft;let t=teams.find(x=>x.id===d.teamId);let activeTeams=teams.filter(x=>!x.archived);
 let teamHtml=d.mode==='team'?`<div class="field"><label for="create-team">专家团</label><select id="create-team"><option value="">临时选择专家</option>${activeTeams.map(x=>`<option value="${x.id}" ${x.id===d.teamId?'selected':''}>${E(x.name)}</option>`).join('')}</select>${d.members.length?`<div class="selected-team"><div class="between"><span class="small">成员${d.custom?' · 已调整':''}</span><button class="inline-link" data-act="toggle-create-picker">调整成员</button></div><div class="chips">${chips(d.members)}</div></div>`:''}${d.picker||!d.members.length?`<div class="member-picker">${memberOptions(d.members,'create')}</div>`:''}<div class="hint">${t?'使用配置副本，可为当前 Hub 单独调整。':'直接组队即可，不要求预先保存专家团。'}</div></div>`:'';
 openDialog(`<div class="modal-head"><h2>新建 Hub</h2>${ib('x','close-modal','关闭')}</div><div class="modal-body"><div class="segmented" role="group" aria-label="Hub 模式"><button data-act="create-mode:standard" aria-pressed="${d.mode==='standard'}" class="${d.mode==='standard'?'active':''}">普通</button><button data-act="create-mode:team" aria-pressed="${d.mode==='team'}" class="${d.mode==='team'?'active':''}">专家团</button></div><p class="mode-help">${d.mode==='team'?'专业工作优先交给所选专家，Hub 负责协调。':'延续通用 Hub 的讨论与普通线程协作。'}</p><div class="field"><label for="create-name">名称</label><input id="create-name" maxlength="80" placeholder="给这项工作起个名字" value="${E(d.name)}"></div>${teamHtml}<div class="field"><label for="create-purpose">${d.mode==='team'?'用途':'工作方向'} <span class="muted" style="font-weight:400">· 可选</span></label><input id="create-purpose" placeholder="主要讨论或处理什么工作" value="${E(d.purpose)}"></div><div class="field"><label for="create-source">项目背景 <span class="muted" style="font-weight:400">· 可选</span></label><select id="create-source"><option value="" ${!d.source?'selected':''}>不关联项目</option><option value="Linx" ${d.source==='Linx'?'selected':''}>Linx</option><option value="论文研究" ${d.source==='论文研究'?'selected':''}>论文研究</option></select></div><div id="create-error" class="error" role="alert"></div></div><div class="modal-footer"><span class="small">创建不会启动任务</span><div class="row"><button class="btn ghost" data-act="close-modal">取消</button><button class="btn primary" data-act="submit-create">创建 Hub ${I('arrow')}</button></div></div>`);bindCreate();}
function syncCreate(){if(!createDraft)return;const value=id=>document.getElementById(id)?.value;for(let [id,key]of[['create-name','name'],['create-purpose','purpose'],['create-source','source']]){let v=value(id);if(v!==undefined)createDraft[key]=v;}}
function bindCreate(){['create-name','create-purpose','create-source'].forEach(id=>document.getElementById(id)?.addEventListener('input',syncCreate));document.getElementById('create-team')?.addEventListener('change',e=>{syncCreate();const t=teams.find(x=>x.id===e.target.value);createDraft.teamId=t?.id||'';createDraft.teamRevision=t?.revision||null;createDraft.members=t?[...t.members]:[];createDraft.templates=t?[...t.templates]:[];createDraft.purpose=t?.purpose||'';createDraft.custom=false;createDraft.picker=!t;if(!createDraft.name.trim()||createDraft.name.endsWith(' Hub'))createDraft.name=t?t.name+' Hub':'';createModal(null,true)});document.querySelectorAll('[data-members="create"]').forEach(c=>c.addEventListener('change',()=>{syncCreate();createDraft.members=[...document.querySelectorAll('[data-members="create"]:checked')].map(x=>x.value);createDraft.custom=!!createDraft.teamId;}))}
function submitCreate(){syncCreate();let d=createDraft,error='';if(!d.name.trim())error='请填写 Hub 名称。';else if(d.mode==='team'&&!d.members.length)error='专家团模式至少选择一位专家。';if(error){document.getElementById('create-error').textContent=error;return}S.hub={...d,name:d.name.trim(),members:d.mode==='team'?[...d.members]:[],teamId:d.mode==='team'?d.teamId:'',teamRevision:d.mode==='team'?d.teamRevision:null};S.run='empty';S.page='hub';S.thread=null;S.planRev=1;S.stageReplies=[];S.threadMsgs=[];S.inspector=null;S.newHub=true;S.scope='all';S.returnText='';S.returning=false;closeDialog();render();toast('Hub 已创建。尚未创建或启动任何工作线程。')}
function openInstance(tab='general',keep=false){if(!keep)instanceDraft=structuredClone(S.hub);S.modal='instance';S.instanceTab=tab;let d=instanceDraft,body='';if(tab==='general'){body=`<div class="field"><label for="instance-name">名称</label><input id="instance-name" value="${E(d.name)}" maxlength="80"></div><div class="field"><label>模式</label><div class="between"><span class="tag">${d.mode==='team'?'专家团':'普通'}</span><button class="inline-link" data-act="switch-instance-mode">${d.mode==='team'?'切换为普通模式':'启用专家团'}</button></div><div class="hint">模式变更只影响后续委托；运行中的计划需先完成或取消。</div></div><div class="field"><label for="instance-purpose">工作方向</label><textarea id="instance-purpose">${E(d.purpose)}</textarea></div><div class="field"><label for="instance-source">项目背景</label><select id="instance-source">${['','Linx','论文研究'].map(n=>`<option value="${n}" ${d.source===n?'selected':''}>${n||'不关联项目'}</option>`).join('')}</select></div>`}else if(tab==='experts'){let t=teams.find(x=>x.id===d.teamId);body=`<h3 style="margin-bottom:6px">本 Hub 的参与专家</h3><p class="muted small">只调整当前 Hub，不会修改专家库中的配置。</p>${t?`<div class="subtle small" style="margin:14px 0">来源：${E(t.name)} v${d.teamRevision}${t.revision>d.teamRevision?`<br><span class="muted">预设已有 v${t.revision}，当前 Hub 仍保留创建时配置。</span>`:''}</div>`:''}<div class="member-picker">${memberOptions(d.members,'instance')}</div><div class="row" style="margin-top:16px"><button class="btn small" data-act="save-instance-preset">另存为专家团</button></div>`}else if(tab==='memory')body=`<h3>记忆与共同约定</h3><p class="muted small" style="margin:10px 0 18px">沿用当前 Hub 的共享指令与记忆。专家团预设不复制历史记忆。</p><div class="subtle"><span class="label">当前共同约定</span><p class="small muted">只在用户确认范围内推进；影响目标和范围的变更先确认。</p></div><p class="muted small" style="margin-top:14px">本原型不改造已有记忆编辑能力。</p>`;else if(tab==='environment')body=`<h3>环境</h3><p class="muted small" style="margin:10px 0 20px">沿用已有工作目录、模型和权限配置，不将它们复制到专家团预设。</p><div class="subtle small">工作目录由现有 Hub 环境机制管理。</div>`;else body=`<h3>插件</h3><p class="muted small" style="margin-top:10px">继续使用原有插件入口。本次不新增团队级技能或 MCP 配置副本。</p>`;
 if(tab==='experts'&&d.mode==='standard')body=`<h3>当前使用普通模式</h3><p class="muted small" style="margin:10px 0 18px">普通模式不使用固定专家团。启用后，可以选择专业成员。</p><button class="btn" data-act="switch-instance-mode">启用专家团</button>`;openDialog(`<div class="modal-head"><div><h2>Hub 设置</h2><span class="muted small">${E(S.hub.name)}</span></div>${ib('x','close-modal','关闭')}</div><div class="instance-layout"><nav class="instance-nav">${[['general','settings','常规'],['experts','team','参与专家'],['memory','brain','记忆'],['environment','folder','环境'],['plugins','tool','插件']].map(([k,i,n])=>`<button data-act="instance-tab:${k}" class="${tab===k?'active':''}">${I(i)}${n}</button>`).join('')}</nav><div class="instance-content">${body}<div id="instance-error" class="error" role="alert"></div></div></div><div class="modal-footer"><span class="small">保存不改写已确认计划</span><div class="row"><button class="btn ghost" data-act="close-modal">取消</button><button class="btn primary" data-act="save-instance">保存</button></div></div>`,'instance-dialog');document.querySelectorAll('[data-members="instance"]').forEach(c=>c.addEventListener('change',()=>instanceDraft.members=[...document.querySelectorAll('[data-members="instance"]:checked')].map(x=>x.value)));}
function syncInstance(){if(!instanceDraft)return;for(let [id,key]of[['instance-name','name'],['instance-purpose','purpose'],['instance-source','source']]){let e=document.getElementById(id);if(e)instanceDraft[key]=e.value}}
function help(){S.modal='help';openDialog(`<div class="modal-head"><h2>原型说明</h2>${ib('x','close-modal','关闭')}</div><div class="modal-body stack"><p class="small muted">基于仓库 main@93c7511 的相关 UI 与契约设计。此文件是独立交互演示，没有接入生产接口。</p><div class="help-grid"><div><h3>已有结构</h3><p>Hub 侧栏与专业线程、成员选择器、专家列表／编辑器、分区设置、成果库、工作项卡片。</p></div><div><h3>本次新增</h3><p>显式双模式、专家团预设、计划确认卡、组合阶段人工放行。不是对现有能力的宣称。</p></div></div><h3>建议体验</h3><p class="small">在“专家团设置”中新建或修改配置 → 创建 Hub → 发起工作 → 确认计划 → 回答产品经理 → 用底部演示栏模拟审核完成 → 确认进入开发。</p><h3>两个配置层次</h3><p class="small">专家团设置保存可复用配置；Hub 设置修改当前实例。使用时生成配置副本，预设更新不覆盖已创建 Hub。</p><h3>数据说明</h3><p class="small">专家团配置保存到此浏览器的本地存储。示例专家、消息和文件均为虚构演示数据。底部状态切换器不属于正式产品。</p><div class="row" style="padding-bottom:16px"><button class="btn" data-act="reset-presets">恢复示例专家团</button><button class="btn primary" data-act="close-modal">开始体验</button></div></div>`)}
function adjust(){S.modal='adjust';openDialog(`<div class="modal-head"><h2>调整计划</h2>${ib('x','close-modal','关闭')}</div><div class="modal-body"><div class="field"><label>执行范围</label><select id="plan-scope"><option value="all" ${S.scope==='all'?'selected':''}>方案确认后，继续本地开发</option><option value="phase" ${S.scope==='phase'?'selected':''}>本次只完成方案阶段</option></select></div><div class="field"><label for="plan-adjustment">补充要求</label><textarea id="plan-adjustment" placeholder="例如：先聚焦个人使用，不做多人协作。"></textarea></div><p class="muted small" style="margin:0 0 17px">生成新版草案后重新确认。不会直接改写已获授权的执行范围。</p></div><div class="modal-footer"><span class="small">当前计划 v${S.planRev}</span><button class="btn primary" data-act="submit-adjust">生成新版计划</button></div>`)}
function expertEditor(id){let x=expert(id);S.modal='expert';openDialog(`<div class="modal-head"><h2>${x?x.name:'新建专家'}</h2>${ib('x','close-modal','关闭')}</div><div class="modal-body"><p class="muted small" style="margin-bottom:18px">此处衔接仓库已有 ExpertEditor，本轮不另建一套编辑器。</p><div class="tabs"><button class="active">基本信息</button><button disabled>技能</button><button disabled>资料</button><button disabled>工具</button></div><div class="subtle"><label class="label">角色与工作方式</label><p class="small">${x?x.desc:'定义专业角色、工作方法与能力。'}</p></div><p class="muted small" style="margin:16px 0 24px">专家能力由原编辑器维护；专家团只引用 Expert ID。这里仅演示入口边界。</p></div><div class="modal-footer"><span class="small">现有能力示意 · 此处不保存</span><button class="btn" data-act="close-modal">返回</button></div>`)}
function bindForms(){document.getElementById('composer')?.addEventListener('submit',e=>{e.preventDefault();sendMessage()});document.getElementById('chat-input')?.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();sendMessage()}});document.getElementById('return-text')?.addEventListener('input',e=>S.returnText=e.target.value);document.getElementById('team-search')?.addEventListener('input',e=>{let pos=e.target.selectionStart;S.search=e.target.value;render();let inp=document.getElementById('team-search');inp.focus();inp.setSelectionRange(pos,pos)});if(S.editor){for(let [id,key]of[['team-name','name'],['team-purpose','purpose']])document.getElementById(id)?.addEventListener('input',e=>{S.editor[key]=e.target.value;editorDirty=true});document.querySelectorAll('[data-members="edit"]').forEach(c=>c.addEventListener('change',()=>{S.editor.members=[...document.querySelectorAll('[data-members="edit"]:checked')].map(x=>x.value);editorDirty=true;document.getElementById('member-count').textContent=S.editor.members.length+' 位'}));document.querySelectorAll('[data-template]').forEach(c=>c.addEventListener('change',()=>{S.editor.templates=[...document.querySelectorAll('[data-template]:checked')].map(x=>x.dataset.template);editorDirty=true}));}}
function sendMessage(){const input=document.getElementById('chat-input');if(!input?.value.trim())return;const text=input.value.trim();if(S.run==='empty'){if(text.includes('讨论')&&!text.includes('审核')&&!text.includes('开发')){S.run='cocreate';S.onlyOne=true;S.thread=null;S.threadMsgs.push(text);render();toast('已进入讨论，没有授权后续执行。');return}S.onlyOne=false;S.run='draft';S.stageReplies=[];S.threadMsgs=[];render();return}
 if(S.run==='cocreate'){S.threadMsgs.push(text);S.stageReplies.push(text);if(S.onlyOne){toast('继续专业讨论。正式交付需另行确认计划。');render();return}S.run='reviewing';render();toast('已补充到原线程。审核阶段无需再次人工确认。');return}
 S.stageReplies.push(text);if(S.thread==='pm')S.threadMsgs.push(text);render();toast('已保留补充意见。涉及目标或范围变化时，应生成新版计划。')}
function saveTeam(){const t=S.editor;let error=!t.name.trim()?'请填写专家团名称。':!t.members.length?'至少选择一位专家。':'';if(error){document.getElementById('team-error').textContent=error;return}if(t.id){teams=teams.map(x=>x.id===t.id?{...t,name:t.name.trim(),revision:x.revision+1}:x)}else teams.push({...t,id:'team-'+Date.now(),name:t.name.trim(),revision:1});saveTeams();S.editor=null;S.search='';editorDirty=false;render();toast('专家团已保存；已有 Hub 保持原配置。')}
function useTeam(id){S.page='hub';S.editor=null;render();createModal(id)}
function demoState(k,reset=false){closeDialog();S.page='hub';S.inspector=null;S.returning=false;S.onlyOne=false;if(reset){S.thread=null;S.newHub=false;S.scope='all';S.planRev=1;S.outputRev=2;S.stageReplies=[];S.threadMsgs=[];S.returnText='';S.hub={name:'Linx 产品方案',mode:'team',purpose:defaults[0].purpose,members:['pm','tech','dev'],source:'Linx',teamId:'product',teamRevision:1,templates:['方案共创与评审']};}S.run=k;render()}
function leaveEditor(next){if(S.editor&&editorDirty){S.modal='unsaved';openDialog(`<div class="modal-head"><h2>保存当前更改？</h2></div><div class="modal-body"><p class="muted small" style="margin-bottom:20px">当前专家团还未保存。</p></div><div class="modal-footer"><button class="btn ghost" data-act="close-modal">继续编辑</button><button class="btn" data-act="discard-editor:${next}">放弃更改</button></div>`);return false}return true}
function act(action){const [k,...parts]=action.split(':');let v=parts.join(':');switch(k){case 'close-modal':closeDialog();break;case 'scope-note':toast('此入口沿用现有产品，不在本轮原型范围。');break;case 'existing-setting':toast('「'+v+'」保留现有设置；本原型聚焦专家与 Hub。');break;case 'help':help();break;case 'create':case 'demo-create':if(!leaveEditor('create'))break;S.page='hub';render();createModal();break;case 'create-mode':syncCreate();createDraft.mode=v;if(v==='team'&&!createDraft.teamId&&!createDraft.members.length){let t=teams.find(x=>!x.archived);if(t){createDraft.teamId=t.id;createDraft.teamRevision=t.revision;createDraft.members=[...t.members];createDraft.templates=[...t.templates];createDraft.purpose=t.purpose;}}createModal(null,true);break;case 'toggle-create-picker':syncCreate();createDraft.picker=!createDraft.picker;createModal(null,true);break;case 'submit-create':submitCreate();break;
case 'settings-teams':if(!leaveEditor('settings'))break;closeDialog();S.page='settings';S.tab='teams';S.thread=null;S.editor=null;S.inspector=null;S.menu=false;render();break;case 'tab':if(!leaveEditor('settings'))break;S.tab=v;S.search='';S.editor=null;render();break;case 'new-team':S.editor={id:null,name:'',purpose:'',members:[],templates:[],revision:0};editorDirty=false;render();document.getElementById('team-name')?.focus();break;case 'edit-team':S.editor=structuredClone(teams.find(x=>x.id===v));editorDirty=false;render();break;case 'save-team':saveTeam();break;case 'back-teams':if(!leaveEditor('settings'))break;S.editor=null;render();break;case 'discard-editor':closeDialog();S.editor=null;editorDirty=false;if(v==='hub'){S.page='hub';render()}else if(v==='create'){S.page='hub';render();createModal()}else{S.page='settings';S.tab='teams';render()}break;case 'use-team':useTeam(v);break;case 'copy-team':{let t=teams.find(x=>x.id===v);S.editor={...structuredClone(t),id:null,name:t.name+' 副本',revision:0};editorDirty=true;render();break}case 'archive-team':S.modal='archive';openDialog(`<div class="modal-head"><h2>归档这份专家团配置？</h2></div><div class="modal-body"><p class="muted small" style="margin-bottom:20px">不再用于新建 Hub。已经创建的 Hub、线程和成果不受影响。</p></div><div class="modal-footer"><button class="btn ghost" data-act="close-modal">取消</button><button class="btn primary" data-act="confirm-archive:${v}">归档配置</button></div>`);break;case 'confirm-archive':teams=teams.map(t=>t.id===v?{...t,archived:true}:t);saveTeams();closeDialog();render();toast('配置已归档，已有 Hub 不受影响。');break;case 'reset-presets':teams=structuredClone(defaults);saveTeams();closeDialog();render();toast('示例专家团已恢复。');break;case 'expert-editor':expertEditor(v);break;
case 'to-hub':if(!leaveEditor('hub'))break;S.page='hub';S.thread=null;S.editor=null;S.menu=false;render();break;case 'ordinary-hub':S.hub={name:'日常工作',mode:'standard',purpose:'',members:[],source:'',teamId:'',templates:[]};S.run='empty';S.page='hub';S.thread=null;S.inspector=null;render();break;case 'demo-work':demoState('draft',true);break;case 'demo-state':if(!leaveEditor('hub'))break;demoState(v);break;case 'suggest':{let input=document.getElementById('chat-input');input.value=v==='discussion'?'我们先讨论一下这个产品的定位。':'和产品经理完善方案，请技术专家审核，我确认后再开发。';input.focus();break}case 'start-from-discussion':S.onlyOne=false;S.thread=null;S.run='draft';render();break;case 'confirm-plan':{if(S.run!=='draft'){toast('计划状态已变化，请查看当前版本。');break}if(S.hub.mode==='team'&&((S.scope==='phase'?['pm','tech']:['pm','tech','dev']).some(id=>!S.hub.members.includes(id))||S.hub.members.some(id=>expert(id)?.unavailable))){S.run='blocked';render();break}S.onlyOne=false;S.run=S.hub.mode==='team'?'cocreate':'reviewing';S.expanded=false;render();toast('计划 v'+S.planRev+' 已确认。留在 Hub，不自动跳转。');break}case 'expand-stage':S.expanded=!S.expanded;render();break;case 'thread':if(v==='tech'&&S.run==='cocreate'&&S.outputRev===2){toast('审核线程会在方案提交后创建。');break}if(S.run==='blocked'){toast('任务尚未成功派发。请先解决能力缺口。');break}if(['empty','draft'].includes(S.run)){toast('线程尚未创建，确认计划后即可进入。');break}if(v==='dev'&&!['develop','done'].includes(S.run)){toast('开发阶段尚未放行。');break}S.thread=v;S.inspector=null;render();break;case 'plan-details':S.inspector='plan';render();break;case 'artifact':S.inspector=v;render();break;case 'library':S.inspector=S.inspector==='library'?null:'library';render();break;case 'close-inspector':S.inspector=null;render();break;case 'approve-gate':if(S.run!=='gate'){toast('确认对象已变化，请刷新当前方案。');break}S.run=S.scope==='phase'||S.hub.mode==='standard'?'done':'develop';S.returning=false;render();toast('已确认需求方案 v'+S.outputRev+'；'+(S.scope==='phase'||S.hub.mode==='standard'?'本次委托完成。':'开发阶段已获放行。'));break;case 'return-gate':S.returning=true;S.returnText='';render();document.getElementById('return-text')?.focus();break;case 'cancel-return':S.returning=false;render();break;case 'send-return':if(!S.returnText.trim()){toast('请填写需要修改的内容。');break}S.returning=false;S.outputRev++;S.run=S.hub.mode==='team'?'cocreate':'reviewing';S.threadMsgs.push(S.returnText);render();toast('修改意见已发回原线程，新版本需重新审核和确认。');break;case 'adjust-plan':adjust();break;case 'submit-adjust':{S.scope=document.getElementById('plan-scope').value;let txt=document.getElementById('plan-adjustment').value.trim();if(txt)S.stageReplies.push(txt);S.planRev++;S.run='draft';S.thread=null;closeDialog();render();toast('已形成新版草案，等待你重新确认。');break}
case 'hub-menu':S.menu=!S.menu;render();break;case 'hub-settings':S.menu=false;render();openInstance();break;case 'hub-members':openInstance('experts');break;case 'instance-tab':syncInstance();openInstance(v,true);break;case 'switch-instance-mode':syncInstance();if(!['empty','draft','done'].includes(S.run)){toast('请先完成或取消当前计划，再切换模式。');break}instanceDraft.mode=instanceDraft.mode==='team'?'standard':'team';if(instanceDraft.mode==='team'&&!instanceDraft.members.length)instanceDraft.members=['pm'];openInstance('general',true);break;case 'save-instance':{syncInstance();if(!instanceDraft.name.trim()){document.getElementById('instance-error').textContent='请填写 Hub 名称。';break}if(instanceDraft.mode==='team'&&!instanceDraft.members.length){document.getElementById('instance-error').textContent='专家团模式至少保留一位专家。';break}S.hub={...instanceDraft,name:instanceDraft.name.trim()};closeDialog();render();toast('已保存当前 Hub 配置，不改写已经确认的计划。');break}case 'save-instance-preset':syncInstance();closeDialog();S.page='settings';S.tab='teams';S.editor={id:null,name:instanceDraft.name+' 配置',purpose:instanceDraft.purpose,members:[...instanceDraft.members],templates:[...(instanceDraft.templates||[])],revision:0};editorDirty=true;render();break;case 'save-preset':if(!S.hub.members.length){toast('当前没有参与专家。先在 Hub 设置中选择成员。');break}S.page='settings';S.tab='teams';S.menu=false;S.editor={id:null,name:S.hub.name+' 配置',purpose:S.hub.purpose,members:[...S.hub.members],templates:[...(S.hub.templates||[])],revision:0};editorDirty=true;render();break;case 'pause':if(['empty','draft','done'].includes(S.run)){toast('当前没有可暂停的执行计划。');S.menu=false;render();break}S.pausedFrom=S.run;S.run='paused';S.menu=false;render();break;case 'resume':S.run=S.pausedFrom||'reviewing';S.menu=false;render();break;case 'reset-work':S.run='draft';S.thread=null;S.inspector=null;S.menu=false;S.stageReplies=[];S.returnText='';S.threadMsgs=[];S.returning=false;S.onlyOne=false;render();break;case 'attach-note':toast('沿用现有消息引用、文件附件与成果引用入口。');break;default:toast('该入口属于已有产品能力，不在此原型中改造。');}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b&&!b.disabled){e.preventDefault();act(b.dataset.act)}});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='s'&&S.editor){e.preventDefault();saveTeam()}});
window.addEventListener('beforeunload',e=>{if(editorDirty){e.preventDefault();e.returnValue=''}});
render();
</script>
</body></html>
