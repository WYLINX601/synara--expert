name: Linx controlled release
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Exact Linx product version; dispatch is build-only"
        required: true
        type: string
permissions: {}
concurrency:
  group: linx-controlled-release
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.policy.outputs.version }}
      tag: ${{ steps.policy.outputs.tag }}
      desktop_flavor: workbench
      publish_release: ${{ github.event_name == 'push' }}
      source_commit: ${{ steps.source.outputs.source_commit }}
      source_tag: ${{ steps.source.outputs.source_tag }}
      lockfile_sha256: ${{ steps.source.outputs.lockfile_sha256 }}
      ref: ${{ steps.source.outputs.source_commit }}
      matrix: ${{ steps.scope.outputs.matrix }}
      cua_matrix: ${{ steps.scope.outputs.cua_matrix }}
      prepare_cua: "true"
      build_icon: "true"
      build_js: "true"
      benchmark_native: "false"
      quality_gates: "true"
      package_artifacts: "true"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --ignore-scripts
      - id: policy
        env:
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: bun scripts/resolve-release-update-policy.ts "$RELEASE_VERSION"
      - id: scope
        env:
          BUILD_PLATFORM: mac-arm64
          PUBLISH_RELEASE: ${{ github.event_name == 'push' }}
        run: bun scripts/resolve-release-build-scope.ts
      - id: source
        env:
          VERSION: ${{ steps.policy.outputs.version }}
          TAG: ${{ steps.policy.outputs.tag }}
          PUBLICATION: ${{ github.event_name == 'push' }}
          COMMIT: ${{ github.sha }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: bun scripts/verify-release-source-provenance.ts "$VERSION" "$TAG" "$PUBLICATION" "$COMMIT" "$REF_TYPE" "$REF_NAME"
      - name: Inspect actual reviewer protection before entering secret-bearing jobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/linx-release.ts protection
  # Preflight resolves policy only, so the quality gates fan out immediately.
  # The serial server suite is the longest gate; it runs in its own shards below.
  quality:
    name: Quality gates
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # Five workspace packages patch the one shared TypeScript install in their
      # prepare scripts; concurrent patching of that file is a race, so lifecycle
      # scripts run one at a time here.
      - name: Install dependencies
        run: bun install --frozen-lockfile --concurrent-scripts=1

      - name: Verify Linx identity
        run: bun run brand:check

      - name: Lint
        if: needs.preflight.outputs.quality_gates == 'true'
        run: bun run lint

      - name: Typecheck
        if: needs.preflight.outputs.quality_gates == 'true'
        run: bun run typecheck

      - name: Test every package except the server
        if: needs.preflight.outputs.quality_gates == 'true'
        run: bunx turbo run test --filter='!@synara/cli'

  # The server package runs its files serially (see apps/server/package.json).
  # Vitest's native shards keep every file and assertion; only the distribution
  # across runners changes, matching the measured three-way split in ci.yml.
  server_tests:
    name: Server tests (${{ matrix.shard }})
    needs: preflight
    if: needs.preflight.outputs.quality_gates == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      # One shard's failure must not cancel the others, so every lane reports
      # complete signal for the release gate.
      fail-fast: false
      matrix:
        shard: ["1/3", "2/3", "3/3"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile --concurrent-scripts=1

      - name: Test server shard ${{ matrix.shard }}
        run: bunx turbo run test --filter=@synara/cli -- --shard=${{ matrix.shard }}

  build_portable:
    name: Build portable JavaScript
    needs: preflight
    if: needs.preflight.outputs.build_js == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
      - name: Report runner capacity
        run: node scripts/report-build-runner.ts
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile --ignore-scripts --filter '!@synara/marketing'
      - name: Build portable outputs
        run: bun run build:desktop
      - name: Record portable output provenance
        env:
          SOURCE_COMMIT: ${{ needs.preflight.outputs.source_commit }}
        run: |
          mkdir -p "$RUNNER_TEMP/portable-build"
          node scripts/portable-build.ts create "$RUNNER_TEMP/portable-build/manifest.json" "$SOURCE_COMMIT"
          tar -cf "$RUNNER_TEMP/portable-build/outputs.tar" apps/desktop/dist-electron apps/server/dist
      - uses: actions/upload-artifact@v7
        with:
          name: portable-build
          retention-days: 30
          path: ${{ runner.temp }}/portable-build/*
          compression-level: 1
          if-no-files-found: error

  build_mac_icon:
    name: Compile macOS icon
    if: needs.preflight.outputs.build_icon == 'true'
    needs: preflight
    runs-on: macos-26
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}

      - name: Compile Icon Composer catalog
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
        run: |
          set -euo pipefail
          xcodebuild -version
          mkdir -p "$RUNNER_TEMP/mac-icon"
          # Same source selection as scripts/lib/brand-assets.ts
          # desktopIconAssetPaths(flavor).macIconComposer. The .icon folder
          # must be named Synara to match CFBundleIconName in the app bundle.
          icon_source="assets/prod/Synara.icon"
          xcrun actool "$icon_source" --compile "$RUNNER_TEMP/mac-icon" --platform macosx --minimum-deployment-target 26.0 --app-icon Synara --include-all-app-icons --output-partial-info-plist "$RUNNER_TEMP/icon-partial.plist" --output-format human-readable-text
          test -s "$RUNNER_TEMP/mac-icon/Assets.car"

      - name: Upload icon catalog
        uses: actions/upload-artifact@v7
        with:
          name: mac-icon-catalog
          retention-days: 30
          path: ${{ runner.temp }}/mac-icon/Assets.car
          if-no-files-found: error

  prepare_cua:
    name: Prepare Cua ${{ matrix.label }}
    needs: preflight
    if: needs.preflight.outputs.prepare_cua == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.preflight.outputs.cua_matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
      - name: Report runner capacity
        run: node scripts/report-build-runner.ts
      - name: Provision verified Cua
        uses: ./.github/actions/provision-cua
        with:
          arch: ${{ matrix.arch }}
      - name: Upload prepared Cua for this candidate
        if: needs.preflight.outputs.package_artifacts == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: prepared-cua-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/cua-artifact
          retention-days: 30
          if-no-files-found: error

  build:
    name: Build ${{ matrix.label }}
    # Quality jobs consume the same fixed source; signing awaits every gate.
    needs: [preflight, build_mac_icon, build_portable, prepare_cua]
    if: ${{ !cancelled() && needs.preflight.result == 'success' && needs.preflight.outputs.package_artifacts == 'true' && (needs.prepare_cua.result == 'success' || (needs.preflight.outputs.prepare_cua == 'false' && needs.prepare_cua.result == 'skipped')) && (needs.build_mac_icon.result == 'success' || (needs.preflight.outputs.build_icon == 'false' && needs.build_mac_icon.result == 'skipped')) && needs.build_portable.result == 'success' }}
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.preflight.outputs.matrix) }}
    uses: ./.github/workflows/release-platform.yml
    with:
      runner: ${{ matrix.runner }}
      platform: ${{ matrix.platform }}
      arch: ${{ matrix.arch }}
      target: ${{ matrix.target }}
      version: ${{ needs.preflight.outputs.version }}
      desktop_flavor: ${{ needs.preflight.outputs.desktop_flavor }}
      publish_release: ${{ needs.preflight.outputs.publish_release == 'true' }}
      source_commit: ${{ needs.preflight.outputs.source_commit }}
      source_tag: ${{ needs.preflight.outputs.source_tag }}
      lockfile_sha256: ${{ needs.preflight.outputs.lockfile_sha256 }}

  sign_candidate:
    if: github.event_name == 'push'
    needs: [preflight, quality, server_tests, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    environment:
      name: linx-signing
    outputs:
      digest: ${{ steps.stage.outputs.digest }}
      url: ${{ steps.stage.outputs.url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@v8
        with:
          name: desktop-mac-arm64
          path: release-publish
      - name: Reinspect environment protection
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/linx-release.ts protection
      - id: stage
        name: Sign and stage complete immutable draft
        env:
          GH_TOKEN: ${{ github.token }}
          LINX_UPDATE_PRIVATE_KEY: ${{ secrets.LINX_UPDATE_PRIVATE_KEY }}
          LINX_BOOTSTRAP_SOURCE_COMMIT: ${{ vars.LINX_BOOTSTRAP_SOURCE_COMMIT }}
        run: bun scripts/linx-release.ts stage release-publish

  promote:
    needs: [preflight, sign_candidate]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    environment:
      name: linx-publish
      url: ${{ needs.sign_candidate.outputs.url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Reinspect actual protection
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/linx-release.ts protection
      - name: Restore exact draft bytes
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ needs.sign_candidate.outputs.digest }}
        run: mkdir -p release-candidate && bun scripts/linx-release.ts restore release-candidate "$DIGEST"
      - name: Promote only approved digest without rebuilding or signing
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ needs.sign_candidate.outputs.digest }}
        run: bun scripts/linx-release.ts promote release-candidate "$DIGEST"
      - name: Validate every public byte without credentials
        env:
          DIGEST: ${{ needs.sign_candidate.outputs.digest }}
        run: bun scripts/linx-release.ts validate release-candidate "$DIGEST"
