<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Synara · MCP 交互原型</title>
    <style>
      :root {
        color-scheme: light;
        --font-ui:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB",
          "Microsoft YaHei", sans-serif;
        --background: color-mix(in srgb, var(--surface) 97%, #000);
        --surface: #fff;
        --surface-soft: color-mix(in srgb, var(--surface) 96%, var(--foreground));
        --foreground: #1a1c1f;
        --muted: #707782;
        --subtle: #959ca5;
        --border: color-mix(in srgb, var(--surface) 88%, var(--foreground));
        --border-strong: color-mix(in srgb, var(--surface) 80%, var(--foreground));
        --primary: #339cff;
        --primary-soft: color-mix(in srgb, var(--surface) 88%, var(--primary));
        --success: #27805a;
        --success-soft: #edf8f1;
        --warning: #9a6822;
        --warning-soft: #fff7e9;
        --danger: #bd4d4d;
        --danger-soft: #fff1f0;
        --shadow: 0 12px 34px rgba(20, 29, 42, 0.12);
        --radius: 10px;
      }
      html[data-theme="dark"] {
        color-scheme: dark;
        --surface: #181818;
        --background: color-mix(in srgb, var(--surface) 82%, #000);
        --surface-soft: color-mix(in srgb, var(--surface) 94%, var(--foreground));
        --foreground: #ffffff;
        --muted: #a0a7b0;
        --subtle: #79818b;
        --border: color-mix(in srgb, var(--surface) 84%, var(--foreground));
        --border-strong: color-mix(in srgb, var(--surface) 76%, var(--foreground));
        --primary: #339cff;
        --primary-soft: color-mix(in srgb, var(--surface) 84%, var(--primary));
        --success: #80d6a7;
        --success-soft: #1b2b22;
        --warning: #e8bd72;
        --warning-soft: #302719;
        --danger: #ff9292;
        --danger-soft: #321e1e;
        --shadow: 0 14px 38px rgba(0, 0, 0, 0.45);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--background);
        color: var(--foreground);
        font: 400 0.9rem/1.5 var(--font-ui);
      }
      button,
      input,
      select,
      textarea {
        color: inherit;
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      button:disabled {
        cursor: not-allowed;
        opacity: 0.48;
      }
      a {
        color: var(--primary);
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
      .app-shell {
        min-height: 100vh;
        display: grid;
        grid-template-columns: 226px minmax(0, 1fr);
      }
      .sidebar {
        position: sticky;
        top: 0;
        height: 100vh;
        overflow: auto;
        border-right: 1px solid var(--border);
        background: var(--surface);
        padding: 18px 12px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 10px 22px;
        font-size: 1rem;
        font-weight: 650;
        letter-spacing: -0.02em;
      }
      .side-caption {
        padding: 12px 10px 6px;
        color: var(--subtle);
        font-size: 0.75rem;
        letter-spacing: 0.02em;
      }
      .side-link {
        width: 100%;
        min-height: 36px;
        display: flex;
        align-items: center;
        gap: 9px;
        border: 0;
        border-radius: 7px;
        padding: 7px 10px;
        text-align: left;
        color: var(--muted);
        background: transparent;
      }
      .side-link:hover {
        background: var(--surface-soft);
        color: var(--foreground);
      }
      .side-link:disabled {
        color: var(--subtle);
        background: transparent;
        opacity: 0.72;
      }
      .side-link.active {
        color: var(--foreground);
        background: var(--surface-soft);
        font-weight: 570;
      }
      .side-dot {
        width: 7px;
        height: 7px;
        flex: 0 0 7px;
        border-radius: 50%;
        background: currentColor;
        opacity: 0.48;
      }
      .main-shell {
        min-width: 0;
      }
      .topbar {
        height: 56px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 0 30px;
        border-bottom: 1px solid var(--border);
        background: var(--surface);
      }
      .breadcrumbs {
        color: var(--muted);
      }
      .top-actions {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .page {
        width: min(100%, 1090px);
        margin: 0 auto;
        padding: 24px 30px 54px;
      }
      .prototype-banner {
        margin-bottom: 20px;
        padding: 10px 13px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--surface);
        color: var(--muted);
        font-size: 0.82rem;
      }
      .prototype-banner strong {
        color: var(--warning);
        font-weight: 600;
      }
      .page-heading {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 18px;
        margin-bottom: 18px;
      }
      h1,
      h2,
      h3,
      p {
        margin-top: 0;
      }
      h1 {
        margin-bottom: 4px;
        font-size: 1.42rem;
        line-height: 1.25;
        font-weight: 620;
        letter-spacing: -0.025em;
      }
      h2 {
        margin-bottom: 4px;
        font-size: 1.05rem;
        font-weight: 600;
      }
      h3 {
        margin-bottom: 5px;
        font-size: 0.93rem;
        font-weight: 600;
      }
      .subtitle {
        margin: 0;
        color: var(--muted);
        font-size: 0.85rem;
      }
      .tabs {
        display: flex;
        align-items: center;
        gap: 22px;
        border-bottom: 1px solid var(--border);
        margin-bottom: 18px;
      }
      .tab {
        position: relative;
        border: 0;
        padding: 9px 1px 11px;
        color: var(--muted);
        background: transparent;
      }
      .tab.active {
        color: var(--foreground);
        font-weight: 600;
      }
      .tab.active::after {
        position: absolute;
        right: 0;
        bottom: -1px;
        left: 0;
        height: 2px;
        content: "";
        background: var(--primary);
        border-radius: 2px 2px 0 0;
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin: 15px 0 12px;
      }
      .search-wrap {
        position: relative;
        flex: 1 1 260px;
        max-width: 460px;
      }
      .search-wrap input {
        width: 100%;
      }
      .filters {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 3px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--surface);
      }
      .filter-btn {
        border: 0;
        border-radius: 5px;
        padding: 6px 10px;
        color: var(--muted);
        background: transparent;
        white-space: nowrap;
        font-size: 0.81rem;
      }
      .filter-btn.active {
        color: var(--foreground);
        background: var(--surface-soft);
      }
      .list {
        border: 1px solid var(--border);
        border-radius: var(--radius);
        overflow: hidden;
        background: var(--surface);
      }
      .service-header,
      .service-row {
        display: grid;
        grid-template-columns: minmax(0, 1.45fr) minmax(0, 0.85fr) minmax(0, 1fr) minmax(0, 1fr);
        align-items: center;
        gap: 14px;
        padding: 13px 16px;
      }
      .service-header {
        color: var(--muted);
        background: var(--surface-soft);
        font-size: 0.78rem;
        font-weight: 560;
      }
      .service-row {
        border-top: 1px solid var(--border);
      }
      .service-row:last-child {
        border-bottom: 0;
      }
      .service-row:hover {
        background: color-mix(in srgb, var(--surface-soft) 42%, var(--surface));
      }
      .service-row > div {
        min-width: 0;
      }
      .summary-cell,
      .check-cell {
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .cell-label {
        display: none;
        color: var(--muted);
        font-size: 0.76rem;
      }
      .service-name {
        border: 0;
        padding: 0;
        color: var(--foreground);
        background: transparent;
        text-align: left;
        font-weight: 590;
      }
      .service-name:hover {
        color: var(--primary);
      }
      .service-name:focus-visible,
      .side-link:focus-visible,
      .tab:focus-visible,
      .filter-btn:focus-visible,
      .btn:focus-visible,
      .row-action:focus-visible {
        outline: 3px solid color-mix(in srgb, var(--primary) 35%, transparent);
        outline-offset: 2px;
      }
      .meta {
        display: block;
        margin-top: 3px;
        color: var(--muted);
        font-size: 0.78rem;
        overflow-wrap: anywhere;
      }
      .kind {
        color: var(--muted);
        font-size: 0.8rem;
        overflow-wrap: anywhere;
      }
      .status {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        width: fit-content;
        border-radius: 99px;
        padding: 3px 8px;
        font-size: 0.76rem;
        white-space: nowrap;
      }
      .status::before {
        width: 6px;
        height: 6px;
        content: "";
        border-radius: 50%;
        background: currentColor;
      }
      .status.active {
        color: var(--success);
        background: var(--success-soft);
      }
      .status.disabled {
        color: var(--warning);
        background: var(--warning-soft);
      }
      .status.retired {
        color: var(--muted);
        background: var(--surface-soft);
      }
      .row-action {
        border: 1px solid var(--border);
        border-radius: 7px;
        padding: 6px 10px;
        color: var(--foreground);
        background: var(--surface);
        white-space: nowrap;
        font-size: 0.8rem;
      }
      .row-action:hover {
        border-color: var(--border-strong);
        background: var(--surface-soft);
      }
      .section {
        margin-top: 20px;
      }
      .section-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 10px;
      }
      .section-heading p {
        margin: 0;
        color: var(--muted);
        font-size: 0.82rem;
      }
      .settings-card {
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface);
        overflow: hidden;
      }
      .settings-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        padding: 14px 16px;
        border-bottom: 1px solid var(--border);
      }
      .settings-row:last-child {
        border-bottom: 0;
      }
      .settings-row-label {
        min-width: 155px;
      }
      .settings-row-content {
        flex: 1;
        min-width: 0;
      }
      .field-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px 18px;
        padding: 16px;
      }
      .field {
        min-width: 0;
      }
      .field.full {
        grid-column: 1 / -1;
      }
      .field label,
      .label {
        display: block;
        margin-bottom: 6px;
        color: var(--foreground);
        font-size: 0.82rem;
        font-weight: 540;
      }
      .hint {
        margin-top: 5px;
        color: var(--muted);
        font-size: 0.77rem;
      }
      input,
      select,
      textarea {
        width: 100%;
        border: 1px solid var(--border-strong);
        border-radius: 7px;
        outline: none;
        padding: 8px 10px;
        background: var(--surface);
      }
      input:focus,
      select:focus,
      textarea:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 15%, transparent);
      }
      input[readonly],
      input:disabled,
      select:disabled,
      textarea:disabled {
        color: var(--muted);
        background: var(--surface-soft);
      }
      textarea {
        min-height: 70px;
        resize: vertical;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        min-height: 34px;
        border: 1px solid var(--border-strong);
        border-radius: 7px;
        padding: 7px 11px;
        color: var(--foreground);
        background: var(--surface);
        font-size: 0.82rem;
        white-space: nowrap;
      }
      .btn:hover:not(:disabled) {
        background: var(--surface-soft);
      }
      .btn.primary {
        border-color: var(--primary);
        color: #fff;
        background: var(--primary);
      }
      html[data-theme="dark"] .btn.primary {
        color: #10213a;
      }
      .btn.primary:hover:not(:disabled) {
        filter: brightness(0.96);
      }
      .btn.quiet {
        border-color: transparent;
        color: var(--muted);
        background: transparent;
      }
      .btn.danger {
        color: var(--danger);
        border-color: color-mix(in srgb, var(--danger) 42%, var(--border));
      }
      .btn.small {
        min-height: 29px;
        padding: 5px 8px;
        font-size: 0.78rem;
      }
      .status-banner {
        margin: 12px 16px 0;
        padding: 10px 12px;
        border-radius: 7px;
        color: var(--muted);
        background: var(--surface-soft);
        font-size: 0.8rem;
      }
      .status-banner.warning {
        color: var(--warning);
        background: var(--warning-soft);
      }
      .status-banner.danger {
        color: var(--danger);
        background: var(--danger-soft);
      }
      .status-banner.info {
        color: var(--primary);
        background: var(--primary-soft);
      }
      .detail-top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        margin: 4px 0 14px;
      }
      .detail-title-line {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 9px;
      }
      .detail-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .detail-tabs {
        margin-top: 18px;
      }
      .detail-pane {
        min-height: 390px;
      }
      .disclosure {
        border-top: 1px solid var(--border);
        padding: 0 16px;
      }
      .disclosure summary {
        padding: 12px 0;
        cursor: pointer;
        color: var(--foreground);
        font-size: 0.82rem;
      }
      .preview-json {
        margin: 0 0 14px;
        border: 1px solid var(--border);
        border-radius: 7px;
        padding: 12px;
        overflow: auto;
        color: var(--muted);
        background: var(--surface-soft);
        font:
          0.77rem/1.55 ui-monospace,
          SFMono-Regular,
          Menlo,
          Consolas,
          monospace;
        white-space: pre-wrap;
      }
      .toolbar-bottom {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-top: 14px;
      }
      .toolbar-bottom .left,
      .toolbar-bottom .right {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }
      .readonly-tag {
        color: var(--muted);
        font-size: 0.78rem;
      }
      .expert-select {
        max-width: 280px;
      }
      .tool-row {
        display: grid;
        grid-template-columns: 22px minmax(0, 1fr);
        align-items: center;
        gap: 10px;
        padding: 11px 14px;
        border-bottom: 1px solid var(--border);
        cursor: pointer;
      }
      .tool-row:last-child {
        border-bottom: 0;
      }
      .tool-row input[type="checkbox"] {
        width: 16px;
        height: 16px;
        accent-color: var(--primary);
      }
      .tool-name {
        font-weight: 550;
      }
      .tool-row:hover {
        background: var(--surface-soft);
      }
      .radio-group {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 18px;
      }
      .radio-option {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        cursor: pointer;
      }
      .radio-option input {
        width: auto;
        accent-color: var(--primary);
      }
      .switch-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 15px;
        padding: 13px 15px;
        border-bottom: 1px solid var(--border);
      }
      .switch-row:last-child {
        border-bottom: 0;
      }
      .switch-copy {
        min-width: 0;
      }
      .switch-copy .meta {
        margin-top: 2px;
      }
      .switch {
        position: relative;
        width: 38px;
        height: 22px;
        flex: 0 0 38px;
        border: 0;
        border-radius: 99px;
        padding: 0;
        background: var(--border-strong);
        transition: background 0.16s ease;
      }
      .switch::after {
        position: absolute;
        top: 3px;
        left: 3px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        content: "";
        background: var(--surface);
        transition: transform 0.16s ease;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.16);
      }
      .switch[aria-checked="true"] {
        background: var(--primary);
      }
      .switch[aria-checked="true"]::after {
        transform: translateX(16px);
      }
      .switch:focus-visible {
        outline: 3px solid color-mix(in srgb, var(--primary) 35%, transparent);
        outline-offset: 2px;
      }
      .reference-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 1px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        overflow: hidden;
        background: var(--border);
      }
      .reference-count {
        padding: 14px;
        background: var(--surface);
      }
      .reference-count strong {
        display: block;
        margin-bottom: 2px;
        font-size: 1.08rem;
        font-weight: 620;
      }
      .reference-count span {
        color: var(--muted);
        font-size: 0.79rem;
      }
      .reference-list {
        margin-top: 16px;
      }
      .reference-item {
        display: grid;
        grid-template-columns: minmax(140px, 0.9fr) minmax(0, 1.4fr) auto;
        align-items: center;
        gap: 12px;
        padding: 12px 14px;
        border-bottom: 1px solid var(--border);
      }
      .reference-item:last-child {
        border-bottom: 0;
      }
      .app-access-heading,
      .app-access-row {
        display: grid;
        grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr) minmax(0, 1.25fr) minmax(0, 0.9fr);
        align-items: center;
        gap: 14px;
        padding: 13px 16px;
      }
      .app-access-heading {
        color: var(--muted);
        background: var(--surface-soft);
        font-size: 0.78rem;
        font-weight: 560;
      }
      .app-access-row {
        border-top: 1px solid var(--border);
      }
      .app-access-row:last-child {
        border-bottom: 0;
      }
      .empty {
        padding: 38px 18px;
        color: var(--muted);
        text-align: center;
      }
      .empty strong {
        display: block;
        margin-bottom: 5px;
        color: var(--foreground);
        font-weight: 570;
      }
      .modal-backdrop {
        position: fixed;
        z-index: 30;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 18px;
        background: rgba(12, 16, 22, 0.42);
      }
      .modal {
        width: min(100%, 500px);
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--surface);
        box-shadow: var(--shadow);
      }
      .modal-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
        padding: 17px 18px 11px;
      }
      .modal-head h2 {
        margin: 0;
        font-size: 1rem;
      }
      .modal-body {
        padding: 0 18px 16px;
        color: var(--muted);
        font-size: 0.86rem;
      }
      .modal-body p:last-child {
        margin-bottom: 0;
      }
      .modal-actions {
        display: flex;
        justify-content: flex-end;
        flex-wrap: wrap;
        gap: 8px;
        padding: 12px 18px 17px;
        border-top: 1px solid var(--border);
      }
      .toast {
        position: fixed;
        z-index: 40;
        right: 22px;
        bottom: 20px;
        max-width: min(420px, calc(100vw - 40px));
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px 14px;
        color: var(--foreground);
        background: var(--surface);
        box-shadow: var(--shadow);
      }
      .not-covered {
        margin-top: 50px;
        padding: 22px;
        border: 1px dashed var(--border-strong);
        border-radius: var(--radius);
        color: var(--muted);
        background: var(--surface);
      }
      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
      }
      @media (max-width: 720px) {
        .app-shell {
          grid-template-columns: 1fr;
        }
        .sidebar {
          position: sticky;
          z-index: 5;
          top: 0;
          height: auto;
          display: flex;
          align-items: center;
          gap: 6px;
          overflow-x: auto;
          border-right: 0;
          border-bottom: 1px solid var(--border);
          padding: 8px 12px;
        }
        .brand {
          flex: 0 0 auto;
          padding: 0 8px 0 0;
        }
        .side-caption {
          display: none;
        }
        .side-link {
          width: auto;
          min-height: 32px;
          flex: 0 0 auto;
          padding: 6px 9px;
        }
        .side-dot {
          display: none;
        }
        .topbar {
          height: 48px;
          padding: 0 16px;
        }
        .page {
          padding: 17px 15px 38px;
        }
        .page-heading {
          align-items: flex-start;
        }
        .toolbar {
          align-items: stretch;
        }
        .search-wrap {
          max-width: none;
          flex-basis: 100%;
        }
        .filters {
          width: fit-content;
          max-width: 100%;
          overflow-x: auto;
        }
        .service-header,
        .app-access-heading {
          display: none;
        }
        .service-row {
          grid-template-columns: minmax(0, 1fr);
          gap: 9px;
          padding: 13px;
        }
        .cell-label {
          display: block;
          margin-bottom: 2px;
        }
        .field-grid {
          grid-template-columns: 1fr;
        }
        .field.full {
          grid-column: auto;
        }
        .detail-top {
          flex-direction: column;
        }
        .detail-actions {
          width: 100%;
        }
        .detail-actions .btn {
          flex: 1 1 auto;
        }
        .tool-row {
          grid-template-columns: 22px minmax(0, 1fr);
        }
        .reference-grid {
          grid-template-columns: 1fr;
        }
        .reference-count {
          display: flex;
          align-items: baseline;
          gap: 8px;
        }
        .reference-count strong {
          margin: 0;
        }
        .reference-item,
        .app-access-row {
          grid-template-columns: minmax(0, 1fr);
          gap: 8px;
        }
        .app-access-row .cell-label {
          display: block;
        }
        .reference-item .row-action {
          width: fit-content;
        }
        .settings-row {
          align-items: flex-start;
          flex-direction: column;
          gap: 7px;
        }
        .settings-row-label {
          min-width: 0;
        }
        .toolbar-bottom {
          align-items: flex-start;
          flex-direction: column;
        }
        .toolbar-bottom .right {
          width: 100%;
        }
        .toolbar-bottom .right .btn {
          flex: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="设置导航">
        <div class="brand"><span>Synara</span></div>
        <div class="side-caption">设置</div>
        <button class="side-link" disabled aria-disabled="true">
          <span class="side-dot"></span>常规
        </button>
        <button class="side-link" disabled aria-disabled="true">
          <span class="side-dot"></span>外观
        </button>
        <button class="side-link" disabled aria-disabled="true">
          <span class="side-dot"></span>模型
        </button>
        <button class="side-link" data-action="navigate" data-target="expert-list">
          <span class="side-dot"></span>专家
        </button>
        <button class="side-link active" data-action="navigate" data-target="mcp">
          <span class="side-dot"></span>MCP
        </button>
      </aside>
      <div class="main-shell">
        <header class="topbar">
          <div class="breadcrumbs">
            设置 <span aria-hidden="true">/</span> <span id="breadcrumb-current">MCP</span>
          </div>
          <div class="top-actions">
            <button class="btn small" id="theme-toggle" type="button">切换暗色</button>
          </div>
        </header>
        <main class="page" id="page" tabindex="-1"></main>
      </div>
    </div>
    <div id="modal-root"></div>
    <div id="toast-root" aria-live="polite"></div>
    <script>
      (function () {
        "use strict";
        var experts = [
          { id: "research-assistant", name: "研究助手" },
          { id: "coding-assistant", name: "编程助手" },
        ];
        var services = [
          {
            id: "literature-search",
            name: "文献检索",
            transport: "stdio",
            command: "uvx",
            args: "mcp-literature-search",
            envRefs: "CROSSREF_TOKEN",
            endpoint: "",
            headerNames: "",
            status: "active",
            revision: 3,
            tools: ["search_papers", "open_paper", "download_pdf"],
            grants: {
              "research-assistant": {
                enabled: true,
                required: false,
                tools: ["search_papers", "open_paper"],
              },
              "coding-assistant": { enabled: false, required: false, tools: [] },
            },
            check: { label: "2026-10-02", revision: 3, current: true },
          },
          {
            id: "browser-automation",
            name: "浏览器自动化",
            transport: "http",
            command: "",
            args: "",
            envRefs: "BROWSER_MCP_TOKEN",
            endpoint: "https://browser.example.invalid/mcp",
            headerNames: "Authorization",
            status: "active",
            revision: 7,
            tools: ["open_page", "click", "capture_screenshot"],
            grants: {
              "research-assistant": { enabled: false, required: false, tools: [] },
              "coding-assistant": { enabled: true, required: true, tools: ["open_page", "click"] },
            },
            check: { label: "2026-10-01", revision: 7, current: true },
          },
          {
            id: "code-index",
            name: "代码索引",
            transport: "stdio",
            command: "bunx",
            args: "mcp-code-index",
            envRefs: "",
            endpoint: "",
            headerNames: "",
            status: "disabled",
            revision: 2,
            tools: ["search_symbols", "read_file"],
            grants: {
              "research-assistant": { enabled: false, required: false, tools: [] },
              "coding-assistant": {
                enabled: true,
                required: false,
                tools: ["search_symbols", "read_file"],
              },
            },
            check: { label: "2026-09-28", revision: 2, current: false },
          },
        ];
        var referenceExamples = {
          "literature-search": { taskRevision: 3, tasks: 2, sessions: 1 },
          "browser-automation": { taskRevision: 7, tasks: 1, sessions: 1 },
          "code-index": { taskRevision: 2, tasks: 0, sessions: 0 },
        };
        var state = {
          screen: "mcp",
          mcpTab: "external",
          detailTab: "config",
          selectedId: null,
          original: null,
          draft: null,
          selectedExpert: experts[0].id,
          search: "",
          filter: "all",
          modal: null,
          pendingAction: null,
          expertId: null,
          authReturnTo: "mcp",
          authFirstEnable: false,
          modalTrigger: null,
          saveError: "",
          toastTimer: null,
        };
        var page = document.getElementById("page");
        var modalRoot = document.getElementById("modal-root");
        var toastRoot = document.getElementById("toast-root");
        var namesById = {};
        experts.forEach(function (expert) {
          namesById[expert.id] = expert.name;
        });

        function escapeHtml(value) {
          return String(value == null ? "" : value).replace(/[&<>"']/g, function (char) {
            return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[char];
          });
        }
        function clone(value) {
          return JSON.parse(JSON.stringify(value));
        }
        function getService(id) {
          return services.find(function (service) {
            return service.id === id;
          });
        }
        function currentService() {
          return state.draft || getService(state.selectedId);
        }
        function statusLabel(status) {
          return status === "active" ? "已启用" : status === "disabled" ? "已停用" : "已退役";
        }
        function statusClass(status) {
          return status === "active" ? "active" : status === "disabled" ? "disabled" : "retired";
        }
        function grantFor(service, expertId) {
          return service.grants[expertId] || { enabled: false, required: false, tools: [] };
        }
        function authorizedExpertCount(service) {
          return experts.filter(function (expert) {
            var grant = grantFor(service, expert.id);
            return grant.enabled && grant.tools.length > 0;
          }).length;
        }
        function referenceFor(id) {
          var service = getService(id);
          var example = referenceExamples[id] || {
            taskRevision: service ? service.revision : 0,
            tasks: 0,
            sessions: 0,
          };
          var authorizedExperts = service
            ? experts
                .filter(function (expert) {
                  var grant = grantFor(service, expert.id);
                  return grant.enabled || grant.tools.length > 0;
                })
                .map(function (expert) {
                  return expert.id;
                })
            : [];
          return {
            experts: authorizedExperts,
            taskRevision: example.taskRevision,
            tasks: example.tasks,
            sessions: example.sessions,
          };
        }
        function referenceTotal(refs) {
          return refs.experts.length + refs.tasks + refs.sessions;
        }
        function isDirty() {
          if (!state.draft) return false;
          if (!state.original) return true;
          return JSON.stringify(state.draft) !== JSON.stringify(state.original);
        }
        function hasEmptyEnabledGrant(service) {
          return Object.keys(service.grants || {}).some(function (expertId) {
            var grant = service.grants[expertId];
            return grant.enabled && grant.tools.length === 0;
          });
        }
        function syncHeader() {
          var label =
            state.screen === "expert-list" || state.screen === "expert-detail"
              ? "专家"
              : state.screen === "app-access"
                ? "MCP / 应用接入"
                : state.screen === "covered"
                  ? "设置"
                  : "MCP";
          var crumb = document.getElementById("breadcrumb-current");
          if (crumb) crumb.textContent = label;
          document.querySelectorAll(".side-link").forEach(function (link) {
            var target = link.getAttribute("data-target");
            link.classList.toggle(
              "active",
              (target === "mcp" &&
                (state.screen === "mcp" ||
                  state.screen === "detail" ||
                  state.screen === "app-access")) ||
                (target &&
                  target.indexOf("expert-") === 0 &&
                  (state.screen === "expert-list" || state.screen === "expert-detail")),
            );
          });
        }
        function banner() {
          return '<div class="prototype-banner">交互演示 · 不连接真实服务，刷新后重置</div>';
        }
        function render() {
          syncHeader();
          if (state.screen === "detail") page.innerHTML = renderDetail();
          else if (state.screen === "mcp" && state.mcpTab === "external")
            page.innerHTML = renderList();
          else if (
            (state.screen === "mcp" && state.mcpTab === "apps") ||
            state.screen === "app-access"
          )
            page.innerHTML = renderAppAccess();
          else if (state.screen === "expert-list") page.innerHTML = renderExpertList();
          else if (state.screen === "expert-detail") page.innerHTML = renderExpertDetail();
          else page.innerHTML = renderNotCovered();
          renderModal();
        }
        function renderMcpHeader(activeTab, title, subtitle) {
          return (
            banner() +
            '<div class="page-heading"><div><h1>' +
            title +
            "</h1>" +
            (subtitle ? '<p class="subtitle">' + subtitle + "</p>" : "") +
            "</div></div>" +
            '<div class="tabs" role="tablist" aria-label="MCP 设置分类">' +
            '<button class="tab ' +
            (activeTab === "external" ? "active" : "") +
            '" role="tab" tabindex="' +
            (activeTab === "external" ? "0" : "-1") +
            '" aria-selected="' +
            (activeTab === "external") +
            '" data-action="mcp-tab" data-tab="external">外部工具</button>' +
            '<button class="tab ' +
            (activeTab === "apps" ? "active" : "") +
            '" role="tab" tabindex="' +
            (activeTab === "apps" ? "0" : "-1") +
            '" aria-selected="' +
            (activeTab === "apps") +
            '" data-action="mcp-tab" data-tab="apps">应用接入</button></div>'
          );
        }
        function renderList() {
          var rows = services.filter(function (service) {
            var haystack = [
              service.name,
              service.id,
              service.command,
              service.args,
              service.endpoint,
            ]
              .join(" ")
              .toLowerCase();
            var matchesSearch = haystack.indexOf(state.search.toLowerCase()) >= 0;
            var count = authorizedExpertCount(service);
            var matchesFilter =
              state.filter === "all" ||
              (state.filter === "authorized" && count > 0) ||
              (state.filter === "unauthorized" && count === 0);
            return matchesSearch && matchesFilter;
          });
          var rowHtml = rows
            .map(function (service) {
              return (
                '<div class="service-row">' +
                '<div class="name-cell"><span class="cell-label">连接</span><button class="service-name" data-action="open-detail" data-id="' +
                escapeHtml(service.id) +
                '">' +
                escapeHtml(service.name) +
                '</button><span class="meta kind">' +
                escapeHtml(service.transport.toUpperCase()) +
                "</span></div>" +
                '<div class="status-cell"><span class="cell-label">全局状态</span><span class="status ' +
                statusClass(service.status) +
                '">' +
                statusLabel(service.status) +
                "</span></div>" +
                '<div class="grant-cell"><span class="cell-label">授权专家</span><button class="service-name" aria-label="管理 ' +
                escapeHtml(service.name) +
                ' 的专家授权" data-action="open-auth" data-id="' +
                escapeHtml(service.id) +
                '">' +
                (authorizedExpertCount(service)
                  ? authorizedExpertCount(service) + " 位专家"
                  : "未授权") +
                "</button></div>" +
                '<div class="check-cell"><span class="cell-label">最近检查</span><span class="kind">' +
                escapeHtml(
                  service.check
                    ? service.check.label +
                        (service.check.current
                          ? " · 配置 v" + service.check.revision
                          : " · 结果已过期")
                    : "未检查",
                ) +
                "</span></div></div>"
              );
            })
            .join("");
          var emptyText =
            state.search || state.filter !== "all"
              ? '<div class="empty"><strong>没有匹配的连接</strong><button class="btn small" data-action="clear-filter">清除搜索和筛选</button></div>'
              : '<div class="empty"><strong>还没有连接</strong>添加连接后可逐个配置专家授权。</div>';
          return (
            renderMcpHeader("external", "MCP", "") +
            '<div class="toolbar"><div class="search-wrap"><label class="visually-hidden" for="service-search">搜索连接</label><input id="service-search" type="search" placeholder="搜索连接" value="' +
            escapeHtml(state.search) +
            '" data-action="search"></div>' +
            '<div class="filters" role="group" aria-label="按授权筛选">' +
            filterButton("all", "全部") +
            filterButton("authorized", "已授权") +
            filterButton("unauthorized", "未授权") +
            "</div>" +
            '<span class="readonly-tag" aria-live="polite">' +
            rows.length +
            ' 条结果</span><button class="btn primary" data-action="add-connection">添加连接</button></div>' +
            '<div class="list" aria-label="外部工具连接列表"><div class="service-header"><span>连接</span><span>全局状态</span><span>授权专家</span><span>最近检查</span></div>' +
            (rowHtml || emptyText) +
            "</div>"
          );
        }
        function filterButton(key, label) {
          return (
            '<button class="filter-btn ' +
            (state.filter === key ? "active" : "") +
            '" data-action="filter" data-filter="' +
            key +
            '" aria-pressed="' +
            (state.filter === key) +
            '">' +
            label +
            "</button>"
          );
        }
        function renderAppAccess() {
          return (
            renderMcpHeader("apps", "MCP", "允许外部应用访问 Synara。") +
            '<div class="section"><div class="settings-card"><div class="app-access-heading"><span>客户端</span><span>配对状态</span><span>访问范围</span><span>操作</span></div>' +
            '<div class="app-access-row"><div><span class="cell-label">客户端</span><strong>示例客户端 A</strong></div><div><span class="cell-label">配对状态</span><span class="status retired">待配对</span></div><div><span class="cell-label">访问范围</span><span>未设置</span></div><div><span class="cell-label">操作</span><button class="btn small" data-action="show-app-note">设置访问范围</button></div></div>' +
            '<div class="app-access-row"><div><span class="cell-label">客户端</span><strong>示例客户端 B</strong></div><div><span class="cell-label">配对状态</span><span class="status retired">待配对</span></div><div><span class="cell-label">访问范围</span><span>未设置</span></div><div><span class="cell-label">操作</span><button class="btn small" data-action="show-app-note">设置访问范围</button></div></div></div></div>'
          );
        }
        function newConnection() {
          var seed = {
            id: "",
            name: "",
            transport: "stdio",
            command: "",
            args: "",
            envRefs: "",
            endpoint: "",
            headerNames: "",
            status: "active",
            revision: 0,
            tools: [],
            grants: {},
            check: null,
          };
          state.screen = "detail";
          state.selectedId = null;
          state.original = null;
          state.draft = seed;
          state.detailTab = "config";
          state.selectedExpert = experts[0].id;
          state.authReturnTo = "mcp";
          state.authFirstEnable = false;
          state.saveError = "";
          render();
          window.setTimeout(function () {
            var field = document.querySelector('[data-field="name"]');
            if (field) field.focus();
          }, 0);
        }
        function openDetail(id, tab, expertId, fromExpert, firstEnable) {
          var service = getService(id);
          if (!service) return;
          state.screen = "detail";
          state.selectedId = id;
          state.original = clone(service);
          state.draft = clone(service);
          state.detailTab = tab || "config";
          state.selectedExpert = expertId || experts[0].id;
          state.expertId = expertId || state.expertId;
          state.authReturnTo = fromExpert ? "expert-detail" : "mcp";
          state.authFirstEnable = !!firstEnable;
          state.saveError = "";
          if (state.authFirstEnable) ensureGrant(state.draft, state.selectedExpert).enabled = true;
          render();
        }
        function configField(label, field, value, hint, type, placeholder) {
          var isRetired = state.draft.status === "retired";
          var disabled = isRetired ? " disabled" : "";
          var readonly = field === "id" && state.original ? " readonly" : "";
          var inputType = type || "text";
          return (
            '<div class="field"><label for="field-' +
            field +
            '">' +
            label +
            '</label><input id="field-' +
            field +
            '" type="' +
            inputType +
            '" data-field="' +
            field +
            '" value="' +
            escapeHtml(value) +
            '"' +
            (placeholder ? ' placeholder="' + escapeHtml(placeholder) + '"' : "") +
            readonly +
            disabled +
            ">" +
            (hint ? '<div class="hint">' + hint + "</div>" : "") +
            "</div>"
          );
        }
        function configPreview(service) {
          var model;
          if (service.transport === "stdio") {
            model = {
              command: service.command || "",
              args: service.args ? service.args.split(/\s+/).filter(Boolean) : [],
              envFromHost: service.envRefs
                ? service.envRefs
                    .split(/\s*,\s*/)
                    .filter(Boolean)
                    .map(function (key) {
                      var item = {};
                      item[key] = "<已脱敏>";
                      return item;
                    })
                    .reduce(function (all, item) {
                      return Object.assign(all, item);
                    }, {})
                : {},
            };
          } else {
            model = {
              url: service.endpoint || "",
              headersFromHost: service.headerNames
                ? service.headerNames
                    .split(/\s*,\s*/)
                    .filter(Boolean)
                    .map(function (key) {
                      var item = {};
                      item[key] = "<已脱敏>";
                      return item;
                    })
                    .reduce(function (all, item) {
                      return Object.assign(all, item);
                    }, {})
                : {},
            };
          }
          return JSON.stringify(model, null, 2);
        }
        function renderDetail() {
          var service = state.draft;
          var readonly = service.status === "retired";
          var isNew = !state.original;
          var invalidGrant = hasEmptyEnabledGrant(service);
          var statusText = state.original
            ? '<span class="status ' +
              statusClass(service.status) +
              '">' +
              statusLabel(service.status) +
              "</span>"
            : "";
          var pane =
            state.detailTab === "config" || isNew
              ? renderConfigPane(service)
              : state.detailTab === "auth"
                ? renderAuthPane(service)
                : renderReferencesPane(service);
          var heading = service.name || "添加连接";
          var statusActions = !state.original
            ? ""
            : service.status === "retired"
              ? '<span class="readonly-tag">已退役 · 不可恢复</span>'
              : '<button class="btn" data-action="open-impact">' +
                (service.status === "active" ? "停用连接" : "重新启用连接") +
                '</button><button class="btn danger" data-action="retire">退役连接</button>';
          return (
            banner() +
            '<div class="detail-top"><div><button class="btn quiet small" data-action="back-list">‹ 返回' +
            (state.authReturnTo === "expert-detail" ? "专家" : "外部工具") +
            '</button><div class="detail-title-line"><h1>' +
            escapeHtml(heading) +
            "</h1>" +
            statusText +
            "</div></div>" +
            '<div class="detail-actions">' +
            (!isNew && state.detailTab === "config"
              ? '<button class="btn" data-action="real-check"' +
                (service.status !== "active" ? ' disabled title="启用连接后才能检查"' : "") +
                ">检查连接</button>"
              : "") +
            statusActions +
            "</div></div>" +
            (!isNew
              ? '<div class="tabs detail-tabs" role="tablist" aria-label="连接详情">' +
                detailTabButton("config", "配置") +
                detailTabButton("auth", "授权") +
                detailTabButton("references", "使用情况") +
                "</div>"
              : "") +
            '<div class="detail-pane">' +
            pane +
            "</div>" +
            '<div class="toolbar-bottom"><div class="left"></div><div class="right">' +
            (!isNew && state.detailTab === "references"
              ? deleteButton(service)
              : '<button class="btn primary" data-action="save-draft"' +
                (readonly || invalidGrant ? " disabled" : "") +
                ">" +
                (state.detailTab === "auth" ? "保存授权" : "保存配置") +
                "</button>") +
            "</div></div>" +
            (invalidGrant
              ? '<div class="status-banner danger" role="alert">启用授权至少选择一个工具，才能保存。</div>'
              : state.saveError
                ? '<div class="status-banner danger" role="alert">' +
                  escapeHtml(state.saveError) +
                  "</div>"
                : "")
          );
        }
        function detailTabButton(key, label) {
          return (
            '<button class="tab ' +
            (state.detailTab === key ? "active" : "") +
            '" role="tab" tabindex="' +
            (state.detailTab === key ? "0" : "-1") +
            '" aria-selected="' +
            (state.detailTab === key) +
            '" data-action="detail-tab" data-tab="' +
            key +
            '">' +
            label +
            "</button>"
          );
        }
        function renderConfigPane(service) {
          var retired = service.status === "retired";
          var typeSelector =
            '<div class="field"><label for="field-transport">连接类型</label><select id="field-transport" data-field="transport"' +
            (retired ? " disabled" : "") +
            '><option value="stdio"' +
            (service.transport === "stdio" ? " selected" : "") +
            '>stdio</option><option value="http"' +
            (service.transport === "http" ? " selected" : "") +
            ">HTTP</option></select></div>";
          var transportFields =
            service.transport === "stdio"
              ? configField("命令", "command", service.command, "", "text", "例：uvx") +
                configField("参数", "args", service.args, "", "text", "例：--query papers") +
                configField("环境变量名", "envRefs", service.envRefs, "仅填写名称；值不会保存。")
              : configField("服务 URL", "endpoint", service.endpoint, "") +
                configField(
                  "请求头名称",

        function ensureGrant(service, expertId) {
          if (!service.grants[expertId])
            service.grants[expertId] = { enabled: false, required: false, tools: [] };
          return service.grants[expertId];
        }
        function toast(message) {
          toastRoot.innerHTML =
            '<div class="toast" role="status">' + escapeHtml(message) + "</div>";
          if (state.toastTimer) window.clearTimeout(state.toastTimer);
          state.toastTimer = window.setTimeout(function () {
            toastRoot.innerHTML = "";
          }, 2600);
        }
        function saveDraft(quiet) {
          var draft = state.draft;
          if (!draft) return false;
          if (!draft.name.trim() || !draft.id.trim()) {
            state.saveError = "请填写显示名称和连接 ID。";
            render();
            return false;
          }
          if (state.original && draft.id !== state.original.id) {
            state.saveError = "连接 ID 保存后不能修改。";
            render();
            return false;
          }
          if (!state.original && getService(draft.id)) {
            state.saveError = "该连接 ID 已存在，请更换 ID。";
            render();
            return false;
          }
          if (hasEmptyEnabledGrant(draft)) {
            state.saveError = "启用授权至少选择一个工具，才能保存。";
            render();
            return false;
          }
          var configChanged =
            !state.original ||
            draft.transport !== state.original.transport ||
            draft.command !== state.original.command ||
            draft.args !== state.original.args ||
            draft.envRefs !== state.original.envRefs ||
            draft.endpoint !== state.original.endpoint ||
            draft.headerNames !== state.original.headerNames;
          if (configChanged && draft.check) draft.check.current = false;
          if (state.original) draft.revision = state.original.revision + (configChanged ? 1 : 0);
          else draft.revision = 1;
          if (state.original) {
            var index = services.findIndex(function (service) {
              return service.id === state.selectedId;
            });
            services[index] = clone(draft);
          } else {
            services.push(clone(draft));
            state.selectedId = draft.id;
          }
          state.original = clone(draft);
          state.draft = clone(draft);
          state.authFirstEnable = false;
          state.saveError = "";
          if (!quiet) toast(state.detailTab === "auth" ? "授权已保存" : "连接配置已保存");
          if (state.modal !== "dirty") render();
          return true;
        }
        function discardDraft() {
          if (state.original) state.draft = clone(state.original);
          else {
            state.draft = null;
            state.selectedId = null;
          }
          state.authFirstEnable = false;
          state.saveError = "";
        }
        function leaveDetail() {
          state.draft = null;
          state.original = null;
          state.selectedId = null;
          state.authFirstEnable = false;
          state.saveError = "";
          state.screen = state.authReturnTo === "expert-detail" ? "expert-detail" : "mcp";
          state.mcpTab = "external";
          render();
        }
        function requestAction(action) {
          if (isDirty()) {
            state.pendingAction = action;
            state.modal = "dirty";
            state.modalTrigger = document.activeElement;
            renderModal();
          } else action();
        }
        function performNavigation(target) {
          state.modal = null;
          state.pendingAction = null;
          if (target === "mcp") {
            state.screen = "mcp";
            state.mcpTab = "external";
          } else if (target === "app-access") {
            state.screen = "app-access";
            state.mcpTab = "apps";
          } else if (target === "expert-list") {
            state.screen = "expert-list";
          } else {
            state.screen = "covered";
          }
          state.draft = null;
          state.original = null;
          state.selectedId = null;
          state.authFirstEnable = false;
          state.saveError = "";
          state.authReturnTo = "mcp";
          render();
        }
        function showModal(kind, data) {
          state.modal = kind;
          state.modalData = data || {};
          state.modalTrigger = document.activeElement;
          renderModal();
        }
        function renderModal() {
          if (!state.modal) {
            modalRoot.innerHTML = "";
            return;
          }
          var title = "",
            body = "",
            actions = "";
          if (state.modal === "dirty") {
            title = "未保存的修改";
            body =
              "<p>保存修改、放弃修改，或继续编辑。</p>" +
              (hasEmptyEnabledGrant(state.draft)
                ? '<div class="status-banner danger" role="alert">启用授权至少选择一个工具，才能保存。</div>'
                : state.saveError
                  ? '<div class="status-banner danger" role="alert">' +
                    escapeHtml(state.saveError) +
                    "</div>"
                  : "");
            actions =
              '<button class="btn" data-action="dirty-stay">继续编辑</button><button class="btn danger" data-action="dirty-discard">放弃修改</button><button class="btn primary" data-action="dirty-save"' +
              (hasEmptyEnabledGrant(state.draft) ? " disabled" : "") +
              ">保存更改</button>";
          } else if (state.modal === "impact") {
            var target = (state.modalData && state.modalData.target) || "disabled";
            title =
              target === "retired"
                ? "退役连接？"
                : target === "active"
                  ? "重新启用连接？"
                  : "停用连接？";
            body =
              target === "disabled"
                ? "<p>停用会阻止后续调用，并尝试取消在途操作；已发出的远端动作无法撤回。</p>"
                : target === "retired"
                  ? "<p>退役不可恢复。后续调用会被阻止；存在使用情况时保留历史配置。</p>"
                  : "<p>重新启用不会自动重试失败调用，也不会更改专家授权。</p>";
            actions =
              '<button class="btn" data-action="modal-close">取消</button><button class="btn danger" data-action="confirm-state" data-state="' +
              target +
              '">' +
              (target === "active" ? "重新启用" : target === "retired" ? "确认退役" : "确认停用") +
              "</button>";
          } else if (state.modal === "delete") {
            title = "删除连接？";
            body = "<p>删除不可恢复。存在授权、任务绑定或运行会话时不能删除。</p>";
            actions =
              '<button class="btn" data-action="modal-close">取消</button><button class="btn danger" data-action="confirm-delete">删除连接</button>';
          } else if (state.modal === "check-info") {
            title = "检查不可用";
            body = "<p>演示不执行连接检查，也不会生成检查成功状态。</p>";
            actions = '<button class="btn primary" data-action="modal-close">知道了</button>';
          } else if (state.modal === "app-note") {
            title = "访问范围";
            body = "<p>此入口仅供预览，不会创建凭证、配对客户端或保存范围。</p>";
            actions = '<button class="btn primary" data-action="modal-close">关闭</button>';
          }
          modalRoot.innerHTML =
            '<div class="modal-backdrop" data-action="backdrop-close"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1"><div class="modal-head"><h2 id="modal-title">' +
            title +
            '</h2><button class="btn quiet small" aria-label="关闭对话框" data-action="modal-close">关闭</button></div><div class="modal-body">' +
            body +
            '</div><div class="modal-actions">' +
            actions +
            "</div></section></div>";
          var focusTarget = modalRoot.querySelector(".modal-actions button");
          if (focusTarget) focusTarget.focus();

        function restoreModalFocus() {
          var trigger = state.modalTrigger;
          state.modalTrigger = null;
          if (trigger && trigger.isConnected) trigger.focus();
          else page.focus();
        }
        function closeModal() {
          state.modal = null;
          renderModal();
          restoreModalFocus();
        }
        function stateChange(target) {
          var service = getService(state.selectedId);
          if (!service) return;
          service.status = target;
          if (state.original) state.original = clone(service);
          if (state.draft) state.draft = clone(service);
          state.modal = null;
          render();
          restoreModalFocus();
          toast(
            target === "disabled"
              ? "已停用，后续调用会被阻止"
              : target === "retired"
                ? "已退役，不能恢复"
                : "已重新启用",
          );
        }
        function toggleExpertGrant(serviceId) {
          var service = getService(serviceId);
          if (!service || service.status !== "active") return;
          var grant = ensureGrant(service, state.expertId);
          if (!grant.tools.length) return;
          grant.enabled = !grant.enabled;

        }
        function handleClick(event) {
          var target = event.target.closest("[data-action]");
          if (!target) return;
          var action = target.getAttribute("data-action");
          if (action === "navigate") {
            var navTarget = target.getAttribute("data-target");
            requestAction(function () {
              performNavigation(navTarget);
            });
          } else if (action === "mcp-tab") {
            var tab = target.getAttribute("data-tab");
            requestAction(function () {
              state.screen = tab === "apps" ? "app-access" : "mcp";
              state.mcpTab = tab;
              state.draft = null;
              state.original = null;
              state.selectedId = null;
              state.authFirstEnable = false;
              state.authReturnTo = "mcp";
              render();
            });
          } else if (action === "filter") {
            state.filter = target.getAttribute("data-filter");
            render();
          } else if (action === "clear-filter") {
            state.search = "";
            state.filter = "all";
            render();
          } else if (action === "add-connection") newConnection();
          else if (action === "open-detail") openDetail(target.getAttribute("data-id"), "config");
          else if (action === "open-auth") openDetail(target.getAttribute("data-id"), "auth");
          else if (action === "detail-tab") {
            var newTab = target.getAttribute("data-tab");
            requestAction(function () {
              state.detailTab = newTab;
              render();
            });
          } else if (action === "back-list") requestAction(leaveDetail);
          else if (action === "save-draft") saveDraft(false);
          else if (action === "real-check")
            requestAction(function () {
              showModal("check-info");
            });
          else if (action === "open-impact") {
            requestAction(function () {
              var s = currentService();
              if (s && s.status !== "retired")
                showModal("impact", { target: s.status === "active" ? "disabled" : "active" });
              else if (s) toast("退役是不可逆终态");
            });
          } else if (action === "retire")
            requestAction(function () {
              showModal("impact", { target: "retired" });
            });
          else if (action === "delete-connection" && !target.disabled)
            requestAction(function () {
              showModal("delete");
            });
          else if (action === "open-expert") {
            state.screen = "expert-detail";
            state.expertId = target.getAttribute("data-expert");
            render();
          } else if (action === "back-experts") {
            state.screen = "expert-list";
            render();
          } else if (action === "expert-grant-toggle")
            toggleExpertGrant(target.getAttribute("data-id"));
          else if (action === "manage-expert-connection")
            openDetail(
              target.getAttribute("data-id"),
              "auth",
              state.expertId,
              true,
              target.getAttribute("data-first-enable") === "true",
            );
          else if (action === "view-expert-connection")
            openDetail(target.getAttribute("data-id"), "config", state.expertId, true, false);
          else if (action === "show-app-note") showModal("app-note");
          else if (action === "dirty-stay") {
            state.pendingAction = null;
            closeModal();
          } else if (action === "dirty-discard") {
            var pending = state.pendingAction;
            var discardTrigger = state.modalTrigger;
            discardDraft();
            state.modal = null;
            state.pendingAction = null;
            renderModal();
            if (pending) pending();
            else render();
            if (state.modal) state.modalTrigger = discardTrigger;
            else {
              state.modalTrigger = discardTrigger;
              restoreModalFocus();
            }
          } else if (action === "dirty-save") {
            var pendingSave = state.pendingAction;
            var saveTrigger = state.modalTrigger;
            if (saveDraft(true)) {
              state.modal = null;
              state.pendingAction = null;
              renderModal();
              if (pendingSave) pendingSave();
              else render();
              if (state.modal) state.modalTrigger = saveTrigger;
              else {
                state.modalTrigger = saveTrigger;
                restoreModalFocus();
              }
            }
          } else if (action === "modal-close") closeModal();
          else if (action === "confirm-state") stateChange(target.getAttribute("data-state"));
          else if (action === "confirm-delete") {
            if (referenceTotal(referenceFor(state.selectedId)) !== 0) {
              state.saveError = "有使用引用，无法删除；可停用或退役。";
              closeModal();
              render();
              return;
            }
            services = services.filter(function (service) {
              return service.id !== state.selectedId;
            });
            delete referenceExamples[state.selectedId];
            state.modal = null;
            state.draft = null;
            state.original = null;
            state.selectedId = null;
            state.screen = "mcp";
            state.mcpTab = "external";
            render();
            restoreModalFocus();
            toast("已删除连接");
          } else if (action === "backdrop-close" && event.target === target) closeModal();
        }
        document.addEventListener("click", handleClick);
        document.addEventListener("input", function (event) {
          var target = event.target;
          if (target.matches("[data-action='search']")) {
            state.search = target.value;
            var start = target.selectionStart;
            var end = target.selectionEnd;
            render();
            var search = document.getElementById("service-search");
            if (search) {
              search.focus();
              search.setSelectionRange(start, end);
            }
          } else if (target.matches("[data-field]")) {
            var field = target.getAttribute("data-field");
            var selectionStart = target.selectionStart;
            var selectionEnd = target.selectionEnd;
            if (state.draft && field !== "transport" && !(field === "id" && state.original)) {
              state.draft[field] = target.value;
            }
            if (state.saveError) {
              state.saveError = "";
              render();
              var currentField = document.querySelector('[data-field="' + field + '"]');
              if (currentField) {
                currentField.focus();
                if (currentField.setSelectionRange && selectionStart != null)
                  currentField.setSelectionRange(selectionStart, selectionEnd);
              }
            }
          }
        });
        document.addEventListener("change", function (event) {
          var target = event.target;
          if (target.matches("[data-field='transport']") && state.draft) {
            state.draft.transport = target.value;
            state.saveError = "";
            if (target.value === "stdio") {
              state.draft.endpoint = "";
              state.draft.headerNames = "";
            } else {
              state.draft.command = "";
              state.draft.args = "";
              state.draft.envRefs = "";
            }
            render();
          } else if (target.matches("[data-action='select-expert']")) {
            var nextExpert = target.value;
            if (nextExpert === state.selectedExpert) return;
            requestAction(function () {
              state.selectedExpert = nextExpert;
              render();
            });
            if (state.modal === "dirty") target.value = state.selectedExpert;
          } else if (target.matches("[data-grant-tool]")) {
            var grant = ensureGrant(state.draft, state.selectedExpert);
            var tool = target.getAttribute("data-grant-tool");
            if (target.checked && grant.tools.indexOf(tool) < 0) grant.tools.push(tool);
            if (!target.checked)
              grant.tools = grant.tools.filter(function (item) {
                return item !== tool;
              });
            state.saveError = "";
            render();
            Array.prototype.some.call(
              document.querySelectorAll("[data-grant-tool]"),
              function (checkbox) {
                if (checkbox.getAttribute("data-grant-tool") === tool) {
                  checkbox.focus();
                  return true;
                }
                return false;
              },
            );
          } else if (target.matches("[data-required-value]")) {
            var requiredGrant = ensureGrant(state.draft, state.selectedExpert);
            requiredGrant.required = target.getAttribute("data-required-value") === "true";
            state.saveError = "";
            var requiredValue = target.getAttribute("data-required-value");
            render();
            var newRequired = document.querySelector(
              '[data-required-value="' + requiredValue + '"]',
            );
            if (newRequired) newRequired.focus();
          }
        });
        document.addEventListener("click", function (event) {
          var target = event.target.closest("[data-action='grant-switch']");
          if (!target || target.disabled || !state.draft) return;
          var grant = ensureGrant(state.draft, state.selectedExpert);
          grant.enabled = !grant.enabled;
          state.saveError = "";
          render();
          var newSwitch = document.querySelector("[data-action='grant-switch']");
          if (newSwitch) newSwitch.focus();
        });
        document.getElementById("theme-toggle").addEventListener("click", function () {
          var html = document.documentElement;
          var dark = html.getAttribute("data-theme") !== "dark";
          html.setAttribute("data-theme", dark ? "dark" : "light");
          this.textContent = dark ? "切换亮色" : "切换暗色";
        });
        document.addEventListener("keydown", function (event) {
          if (state.modal && event.key === "Escape") {
            closeModal();
            return;
          }
          if (state.modal && event.key === "Tab") {
            var focusable = Array.prototype.slice.call(
              modalRoot.querySelectorAll(
                "button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [href], [tabindex]:not([tabindex='-1'])",
              ),
            );
            if (!focusable.length) {
              event.preventDefault();
              return;
            }
            var first = focusable[0];
            var last = focusable[focusable.length - 1];
            if (
              event.shiftKey &&
              (document.activeElement === first || !modalRoot.contains(document.activeElement))
            ) {
              event.preventDefault();
              last.focus();
            } else if (
              !event.shiftKey &&
              (document.activeElement === last || !modalRoot.contains(document.activeElement))
            ) {
              event.preventDefault();
              first.focus();
            }
            return;
          }
          if (state.modal) return;
          var tab = event.target.closest && event.target.closest("[role='tab']");
          if (!tab || !["ArrowRight", "ArrowLeft", "Home", "End"].includes(event.key)) return;
          var tablist = tab.closest("[role='tablist']");
          if (!tablist) return;
          var tabs = Array.prototype.slice.call(tablist.querySelectorAll("[role='tab']"));
          var index = tabs.indexOf(tab);
          var nextIndex =
            event.key === "Home"
              ? 0
              : event.key === "End"
                ? tabs.length - 1
                : (index + (event.key === "ArrowRight" ? 1 : tabs.length - 1)) % tabs.length;
          event.preventDefault();
          tabs[nextIndex].click();
          window.setTimeout(function () {
            if (state.modal) return;
            var active = page.querySelector("[role='tab'][aria-selected='true']");
            if (active) active.focus();
          }, 0);
        });
        render();
      })();
    </script>
  </body>
</html>
