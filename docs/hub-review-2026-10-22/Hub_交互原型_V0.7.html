<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Hub · V0.7 原型评审稿</title>
    <style>
      :root {
        --bg: #fff;
        --sidebar: #f7f7f5;
        --canvas: #fbfbfa;
        --text: #262723;
        --muted: #777973;
        --line: #e6e7e1;
        --soft: #f2f3ef;
        --accent: #405348;
        --accentsoft: #eef2ed;
        --orange: #906329;
        --orangesoft: #faf4e8;
        --red: #a1433c;
        --radius: 10px;
        --shadow: 0 20px 90px #22231e1c;
        --rail: 58px;
        --side: 224px;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font:
          14px/1.6 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          "PingFang SC",
          "Noto Sans CJK SC",
          "Microsoft Yahei",
          sans-serif;
        color: var(--text);
        background: var(--canvas);
      }
      button,
      input,
      textarea,
      select {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
      }
      button:disabled {
        cursor: not-allowed;
        opacity: 0.42;
      }
      a {
        color: inherit;
      }
      button,
      input,
      textarea,
      select,
      a {
        outline-offset: 3px;
      }
      button:focus-visible,
      a:focus-visible {
        outline: 2px solid var(--accent);
      }
      button {
        border: 0;
        background: none;
      }
      input,
      textarea,
      select {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        padding: 9px 12px;
        outline: none;
      }
      input:focus,
      textarea:focus,
      select:focus {
        border-color: #839486;
        box-shadow: 0 0 0 2px #4053480d;
      }
      textarea {
        resize: vertical;
        min-height: 76px;
      }
      input[type="checkbox"] {
        width: 16px;
        height: 16px;
        accent-color: var(--accent);
        box-shadow: none;
        flex: none;
      }
      svg {
        width: 18px;
        height: 18px;
        vertical-align: middle;
        flex: none;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.55;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1 {
        font-size: 24px;
        letter-spacing: -0.6px;
        font-weight: 650;
      }
      h2 {
        font-size: 19px;
        font-weight: 620;
      }
      h3 {
        font-size: 15px;
        font-weight: 600;
      }
      small,
      .small {
        font-size: 12px;
      }
      .muted {
        color: var(--muted);
      }
      .row {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .between {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .grow {
        flex: 1;
        min-width: 0;
      }
      .stack {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        padding: 8px 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: white;
        font-weight: 540;
        font-size: 13px;
        white-space: nowrap;
        line-height: 20px;
      }
      .btn:hover {
        background: var(--soft);
      }
      .btn.primary {
        background: var(--text);
        color: white;
        border-color: var(--text);
      }
      .btn.primary:hover {
        background: #41433c;
      }
      .btn.ghost {
        border-color: transparent;
        background: transparent;
      }
      .btn.ghost:hover {
        background: var(--soft);
      }
      .btn.small {
        padding: 5px 10px;
        font-size: 12px;
      }
      .btn.danger {
        color: var(--red);
      }
      .iconbtn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 32px;
        height: 32px;
        border-radius: 7px;
        color: var(--muted);
        flex: none;
      }
      .iconbtn:hover {
        background: var(--soft);
        color: var(--text);
      }
      .tag {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 2px 7px;
        border-radius: 5px;
        font-size: 11px;
        line-height: 20px;
        background: var(--soft);
        color: var(--muted);
        white-space: nowrap;
      }
      .tag.green {
        background: var(--accentsoft);
        color: var(--accent);
      }
      .tag.amber {
        background: var(--orangesoft);
        color: var(--orange);
      }
      .tag svg {
        width: 13px;
        height: 13px;
      }
      .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        display: inline-block;
        background: #98a497;
      }
      .dot.amber {
        background: #bd9155;
      }
      .divider {
        height: 1px;
        background: var(--line);
        margin: 20px 0;
      }
      .field {
        margin-bottom: 19px;
      }
      .field > label,
      .label {
        display: block;
        font-size: 12px;
        font-weight: 580;
        margin-bottom: 7px;
      }
      .field .hint {
        font-size: 11px;
        color: var(--muted);
        margin-top: 6px;
      }
      .inline-link {
        color: var(--accent);
        font-size: 12px;
        padding: 0;
        text-decoration: none;
      }
      .inline-link:hover {
        text-decoration: underline;
      }
      .chips {
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        background: var(--soft);
        border: 1px solid transparent;
        padding: 5px 9px;
        border-radius: 6px;
        font-size: 12px;
      }
      .chip .iconbtn {
        width: 18px;
        height: 18px;
      }
      .chip .iconbtn svg {
        width: 12px;
        height: 12px;
      }
      .avatar {
        width: 25px;
        height: 25px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: #fff;
        font-size: 11px;
        color: var(--accent);
        flex: none;
      }
      .avatar.lg {
        width: 36px;
        height: 36px;
        font-size: 14px;
        border-radius: 10px;
      }
      .subtle {
        background: var(--canvas);
        border: 1px solid var(--line);
        border-radius: 9px;
        padding: 12px 14px;
      }
      .error {
        color: var(--red);
        font-size: 12px;
        margin: 9px 0;
      }
      .hintbox {
        border: 1px solid #eaddc5;
        background: var(--orangesoft);
        border-radius: 8px;
        padding: 10px 12px;
        font-size: 12px;
        color: #7d5a2e;
      }
      .segmented {
        display: flex;
        gap: 3px;
        padding: 4px;
        background: var(--soft);
        border-radius: 9px;
      }
      .segmented button {
        flex: 1;
        border-radius: 6px;
        padding: 7px 12px;
        font-size: 13px;
        color: var(--muted);
      }
      .segmented button.active {
        background: white;
        color: var(--text);
        box-shadow: 0 1px 3px #2221;
        font-weight: 600;
      }
      .empty-small {
        padding: 20px;
        text-align: center;
        color: var(--muted);
        font-size: 13px;
      }
      /* Prototype-only tools live outside the product. */
      .proto-top {
        height: 42px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 18px;
        border-bottom: 1px solid var(--line);
        background: #eeefe9;
        font-size: 11px;
        gap: 12px;
      }
      .proto-brand {
        display: flex;
        align-items: center;
        gap: 10px;
        white-space: nowrap;
        letter-spacing: 0.2px;
      }
      .proto-brand strong {
        font-size: 11px;
      }
      .proto-links {
        display: flex;
        gap: 6px;
      }
      .proto-links button {
        font-size: 11px;
        padding: 4px 10px;
        border-radius: 5px;
        color: #62685e;
      }
      .proto-links button:hover,
      .proto-links button.current {
        background: #fff;
        color: #292c27;
      }
      .prototype-note {
        color: #7c8275;
        white-space: nowrap;
      }
      .shell {
        height: calc(100dvh - 82px);
        display: flex;
        overflow: hidden;
      }
      .rail {
        width: var(--rail);
        flex: none;
        background: #efefeb;
        display: flex;
        align-items: center;
        flex-direction: column;
        padding: 16px 8px 12px;
        gap: 14px;
        border-right: 1px solid var(--line);
      }
      .mark {
        width: 31px;
        height: 31px;
        border-radius: 9px;
        display: grid;
        place-items: center;
        background: #30372e;
        color: white;
        font: bold 17px Georgia;
        margin-bottom: 13px;
      }
      .rail button {
        width: 37px;
        height: 37px;
        border-radius: 9px;
        color: #868980;
      }
      .rail button:hover {
        background: #e5e7df;
      }
      .rail button.active {
        background: #fff;
        color: #3d513f;
        box-shadow: 0 1px 3px #2221;
      }
      .rail .space {
        flex: 1;
      }
      .side {
        width: var(--side);
        flex: none;
        background: var(--sidebar);
        border-right: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        padding: 19px 12px 12px;
      }
      .side .side-heading {
        padding: 0 10px 17px;
        font-size: 16px;
        font-weight: 600;
      }
      .newhub {
        display: flex;
        width: 100%;
        align-items: center;
        gap: 9px;
        border: 1px solid var(--line);
        background: #fff;
        border-radius: 8px;
        padding: 9px 11px;
        font-size: 13px;
        margin: 0 0 23px;
      }
      .side-label {
        font-size: 10px;
        letter-spacing: 0.6px;
        color: #979b91;
        padding: 0 12px;
        margin: 10px 0 6px;
      }
      .navrow {
        display: flex;
        align-items: center;
        gap: 9px;
        border-radius: 7px;
        padding: 8px 10px;
        font-size: 13px;
        width: 100%;
        text-align: left;
        position: relative;
      }
      .navrow:hover {
        background: #eceee7;
      }
      .navrow.active {
        background: #e8ebe2;
        color: #2d3f31;
        font-weight: 550;
      }
      .navrow .badge-count {
        margin-left: auto;
        font-size: 10px;
        color: var(--orange);
        background: var(--orangesoft);
        border-radius: 4px;
        padding: 0 5px;
      }
      .threadrow {
        padding-left: 33px;
        font-size: 12px;
        color: var(--muted);
      }
      .threadrow svg {
        width: 14px;
        height: 14px;
      }
      .nav-divider {
        height: 1px;
        background: var(--line);
        margin: 16px 10px;
      }
      .workspace-footer {
        margin-top: auto;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 8px 2px;
        border-top: 1px solid var(--line);
        font-size: 12px;
      }
      .workspace-footer .avatar {
        background: #eceee6;
      }
      .side .group-header {
        font-size: 13px;
        padding: 7px 10px;
        font-weight: 560;
        display: flex;
        gap: 7px;
        align-items: center;
      }
      .main {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        background: var(--bg);
        position: relative;
      }
      .topbar {
        height: 66px;
        min-height: 66px;
        border-bottom: 1px solid var(--line);
        padding: 0 28px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }
      .topbar .crumb {
        display: flex;
        gap: 10px;
        align-items: center;
        font-size: 13px;
      }
      .topbar .crumb .slash {
        color: #bec1b6;
      }
      .topbar .tag {
        font-size: 10px;
      }
      .hubbody {
        flex: 1;
        overflow: auto;
        scroll-behavior: smooth;
      }
      .conversation {
        width: min(100% - 80px, 780px);
        margin: 0 auto;
        padding: 28px 0 20px;
      }
      .message {
        margin-bottom: 23px;
      }
      .message .sender {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 9px;
        font-size: 12px;
        font-weight: 600;
      }
      .message.user .bubble {
        background: var(--soft);
        border-radius: 11px 11px 3px 11px;
        padding: 13px 17px;
        margin-left: 64px;
        font-size: 13px;
        line-height: 1.9;
      }
      .message.ai .body {
        font-size: 13px;
        line-height: 1.9;
        padding-left: 33px;
      }
      .message .source {
        font-weight: 400;
        color: var(--muted);
        font-size: 11px;
      }
      .card {
        margin: 12px 0 22px 33px;
        border: 1px solid #dfe3d9;
        border-radius: 12px;
        background: white;
        overflow: hidden;
      }
      .card-header {
        padding: 18px 20px 14px;
      }
      .card-header .meta {
        font-size: 11px;
        color: var(--muted);
        margin-top: 5px;
      }
      .planbody {
        padding: 0 20px 8px;
      }
      .stage {
        border-top: 1px solid var(--line);
        padding: 15px 0;
      }
      .stage-header {
        display: flex;
        align-items: flex-start;
        gap: 11px;
      }
      .stepdot {
        width: 23px;
        height: 23px;
        display: flex;
        justify-content: center;
        align-items: center;
        border: 1px solid var(--line);
        border-radius: 50%;
        font-size: 10px;
        color: var(--muted);
        margin-top: 2px;
        flex: none;
      }
      .stepdot.done {
        background: var(--accentsoft);
        border-color: #d7e3d3;
        color: var(--accent);
      }
      .stepdot.done svg {
        width: 12px;
        height: 12px;
      }
      .stepdot.current {
        background: var(--text);
        color: white;
        border-color: var(--text);
      }
      .stage-title {
        font-size: 13px;
        font-weight: 570;
      }
      .stage-sub {
        font-size: 11px;
        color: var(--muted);
        margin-top: 4px;
      }
      .stage-status {
        font-size: 11px;
        color: var(--muted);
        margin-left: auto;
        white-space: nowrap;
        padding-top: 3px;
      }
      .stage-status.wait {
        color: var(--orange);
      }
      .stage-status.live {
        color: var(--accent);
      }
      .stage-detail {
        margin: 13px 0 0 34px;
        border-left: 1px solid var(--line);
        padding-left: 15px;
      }
      .stage-detail .worker {
        display: flex;
        gap: 9px;
        align-items: center;
        padding: 7px 0;
        font-size: 12px;
      }
      .stage-detail .worker .muted {
        margin-left: auto;
        font-size: 11px;
      }
      .stage-detail .arrowtext {
        font-size: 10px;
        color: #93988c;
        padding: 0 0 0 34px;
      }
      .gate-line {
        display: flex;
        gap: 7px;
        align-items: center;
        color: #8b744e;
        font-size: 11px;
        margin: 3px 0 12px 34px;
      }
      .gate-line svg {
        width: 13px;
        height: 13px;
      }
      .stage.dim {
        color: #9a9d92;
      }
      .card-actions {
        padding: 13px 20px;
        background: var(--canvas);
        border-top: 1px solid var(--line);
        display: flex;
        gap: 9px;
        align-items: center;
        flex-wrap: wrap;
      }
      .card-actions .footnote {
        font-size: 11px;
        color: var(--muted);
        margin-left: auto;
      }
      .decision {
        background: #faf8f1;
        border: 1px solid #e9dfc8;
        padding: 14px;
        border-radius: 8px;
        margin: 10px 0 16px 34px;
      }
      .decision .title {
        font-size: 13px;
        font-weight: 590;
      }
      .decision .detail {
        font-size: 12px;
        color: #747365;
        margin-top: 5px;
        line-height: 1.8;
      }
      .outputs {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 13px;
      }
      .filepill {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        border: 1px solid var(--line);
        border-radius: 6px;
        font-size: 11px;
        background: #fff;
        padding: 6px 9px;
      }
      .filepill:hover {
        border-color: #a6b19f;
        background: #fafff8;
      }
      .filepill svg {
        width: 14px;
        height: 14px;
      }
      .filepill span {
        color: var(--muted);
        font-size: 10px;
      }
      .composer-wrap {
        width: min(100% - 80px, 780px);
        margin: 0 auto;
        padding: 4px 0 16px;
        flex: none;
      }
      .composer {
        border: 1px solid #dfe2d7;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 3px 12px #00000003;
      }
      .composer textarea {
        border: 0;
        box-shadow: none;
        resize: none;
        background: none;
        min-height: 64px;
        padding: 14px 15px 4px;
        font-size: 13px;
        display: block;
      }
      .composer-bottom {
        padding: 4px 9px 8px 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .send {
        width: 29px;
        height: 29px;
        border-radius: 7px;
        background: var(--text);
        color: white;
      }
      .send svg {
        width: 16px;
        height: 16px;
      }
      .composer-bottom .small {
        font-size: 10px;
        color: #94988b;
      }
      .composer-context {
        border: 1px solid var(--line);
        border-bottom: 0;
        border-radius: 9px 9px 0 0;
        font-size: 11px;
        margin: 0 13px;
        padding: 6px 10px;
        display: flex;
        justify-content: space-between;
        background: var(--canvas);
      }
      .welcome {
        max-width: 610px;
        margin: 80px auto;
        text-align: center;
      }
      .welcome .large-symbol {
        display: grid;
        place-items: center;
        width: 52px;
        height: 52px;
        background: var(--accentsoft);
        border-radius: 15px;
        margin: 0 auto 20px;
        color: var(--accent);
      }
      .welcome .large-symbol svg {
        width: 25px;
        height: 25px;
      }
      .welcome p {
        color: var(--muted);
        font-size: 13px;
        margin: 9px 0 25px;
      }
      .suggestions {
        display: flex;
        gap: 9px;
        justify-content: center;
        flex-wrap: wrap;
      }
      .suggestions button {
        padding: 9px 13px;
        border: 1px solid var(--line);
        border-radius: 8px;
        text-align: left;
        font-size: 12px;
      }
      .suggestions button:hover {
        border-color: #a0ad99;
      }
      .pending-strip {
        padding: 9px 15px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--canvas);
        margin-bottom: 23px;
        font-size: 11px;
        color: var(--muted);
      }
      .pending-strip svg {
        width: 14px;
        height: 14px;
      }
      .review-feedback {
        margin-top: 12px;
        padding: 11px 13px;
        border-left: 2px solid #b2bda9;
        background: var(--canvas);
        font-size: 12px;
      }
      /* Settings reuse list/editor, not a new global navigation destination. */
      .settings-body {
        overflow: auto;
        flex: 1;
      }
      .settings-content {
        max-width: 880px;
        padding: 35px 42px 60px;
        margin: 0 auto;
      }
      .page-heading {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 21px;
      }
      .tabs {
        display: flex;
        gap: 24px;
        border-bottom: 1px solid var(--line);
        margin-bottom: 22px;
      }
      .tabs button {
        padding: 0 0 12px;
        color: var(--muted);
        font-size: 13px;
        border-bottom: 2px solid transparent;
        margin-bottom: -1px;
      }
      .tabs button.active {
        color: var(--text);
        border-color: var(--text);
        font-weight: 600;
      }
      .list-toolbar {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        align-items: center;
        margin-bottom: 18px;
      }
      .searchbox {
        position: relative;
        max-width: 280px;
        width: 100%;
      }
      .searchbox svg {
        position: absolute;
        top: 11px;
        left: 11px;
        width: 16px;
        height: 16px;
        color: #9b9f93;
      }
      .searchbox input {
        padding: 8px 12px 8px 35px;
        font-size: 12px;
        background: var(--canvas);
      }
      .listrows {
        border-top: 1px solid var(--line);
      }
      .listitem {
        border-bottom: 1px solid var(--line);
        padding: 19px 4px;
        display: flex;
        align-items: center;
        gap: 15px;
      }
      .listitem:hover {
        background: #fcfcfa;
      }
      .listitem-main {
        flex: 1;
        text-align: left;
        padding: 0;
      }
      .listitem-title {
        font-size: 14px;
        font-weight: 590;
      }

      .inspect-body h3 {

      }
      .proto-bottom .spacer {
        flex: 1;
      }
      .toast {

      }

      }
      .focus-item p {

        margin: 3px 0;
      }
      .help-grid {
        display: grid;

        gap: 12px;
      }
      .help-grid > div {
        border: 1px solid var(--line);
        border-radius: 8px;

        font-size: 12px;

      .help-grid p {
        font-size: 11px;

      }
      .note-pill {

          --side: 196px;

        }

          padding: 0 15px;
        }
        .topbar .source-crumb {

          padding: 24px 18px;

        }

        }
        .instance-nav {
          width: 112px;

        }
        .instance-content {
          padding: 18px 14px;
        }

          width: 100%;

        }

        }

      @media (prefers-reduced-motion: reduce) {

          transition: none !important;
        }

      .collaboration {

      }
      .work-card .stage-status {
        font-size: 10px;
      }
      .work-card .stepdot {

      }
      .work-card .stage-detail {

      }

          else if (r === "revising") receipt = "已送交重新审核";
          else if (r === "develop") receipt = "已结束本阶段";
          return `<article class="flow-action-card flow-history" aria-label="历史协作记录"><div class="flow-card-meta">Hub <span>·</span> 协作记录 <span class="flow-card-version">计划 v${d.planRev}</span></div><h3>${E(title)}</h3><p>${body}</p>${r === "draft" && d.notes.length ? `<p class="small muted">补充要求：${d.notes.map(E).join("；")}</p>` : ""}${r === "revising" && d.feedback ? `<blockquote>${E(d.feedback)}</blockquote>` : ""}${r === "gate" ? `<div class="flow-files">${flowAction("需求方案 v" + v, "artifact:prd@" + v)}${!d.standard ? flowAction("审核记录 · 方案 v" + v, "artifact:review@" + v) : ""}</div>` : ""}<div class="flow-outcome">${I("check")}<span>${receipt}</span></div></article>`;
        }
        let actions = "",
          files = "";
        if (paused) actions = flowAction("恢复执行", "resume", true);
        else if (r === "draft")
          actions =
            flowAction("确认执行", "confirm-plan", true) +
            flowAction("调整计划", "adjust-plan") +
            flowAction("计划详情", "plan-details");
        else if (r === "blocked")
          actions =
            flowAction("调整参与专家", "hub-members", true) + flowAction("修改计划", "adjust-plan");
        else if (r === "cocreate")
          actions =
            flowAction("在此回复", "reply-here:pm", true) +
            flowAction("去专业线程回答", "thread:pm");
        else if (r === "revising")
          actions =
            flowAction("查看修订线程", "thread:" + (d.standard ? "general" : "pm")) +
            flowAction("暂停", "pause");
        else if (r === "reviewing")
          actions =
            flowAction(
              "查看" + (d.standard ? "工作" : "审核") + "线程",
              "thread:" + (d.standard ? "general" : "tech"),
            ) + flowAction("暂停", "pause");
        else if (r === "gate") {
          actions =
            flowAction(d.phase ? "确认并完成" : "确认并进入开发", "approve-gate", true) +
            flowAction("退回修改", "return-gate");
          files =
            flowAction("需求方案 v" + v, "artifact:prd@" + v) +
            (!d.standard ? flowAction("审核记录 · 方案 v" + v, "artifact:review@" + v) : "");
        } else if (r === "develop")
          actions = flowAction("查看开发线程", "thread:dev", true) + flowAction("暂停", "pause");
        else if (r === "done")
          actions =
            flowAction("查看交付摘要", "artifact:result", true) + flowAction("全部成果", "library");
        const returnForm =
          S.returning && r === "gate" && !paused
            ? `<div class="flow-return"><label class="label" for="return-text">需要修改什么？</label><textarea id="return-text" placeholder="写下修改意见，继续使用原作者线程。">${E(S.returnText)}</textarea><div class="flow-actions">${flowAction("发送修改意见", "send-return", true)}${flowAction("取消", "cancel-return")}</div></div>`
            : "";
        return `<article class="flow-action-card" aria-label="当前协作操作"><div class="flow-card-meta">Hub <span>·</span> ${r === "gate" ? "成果提交" : r === "cocreate" ? "转达产品经理" : paused ? "暂停回执" : "协作消息"} <span class="flow-card-version">计划 v${d.planRev}</span></div><h3>${title}</h3><p>${body}</p>${r === "draft" && d.notes.length ? `<p class="small muted">补充要求：${d.notes.map(E).join("；")}</p>` : ""}${r === "revising" && d.feedback ? `<blockquote>${E(d.feedback)}</blockquote>` : ""}${files ? `<div class="flow-files">${files}</div>` : ""}${returnForm || `<div class="flow-actions">${actions}</div>`}</article>`;
      }
      function planCard() {
        return actionCard(flowSnapshot(), true, null);
      }
      function graphBoard() {
        if (S.run === "empty" || S.onlyOne) return "";
        const d = flowSnapshot(),
          r = d.effective,
          paused = S.run === "paused",
          draft = ["draft", "blocked"].includes(r);
        const active = ["cocreate", "revising"].includes(r)
          ? "pm"
          : r === "reviewing"
            ? d.standard
              ? "pm"
              : "tech"
            : r === "gate"
              ? "gate"
              : r === "develop"
                ? "dev"
                : null;
        const items = [
          { id: "pm", name: d.standard ? "形成方案" : "需求共创" },
          ...(!d.standard ? [{ id: "tech", name: "技术审核" }] : []),
          { id: "gate", name: "你的确认" },
          ...(!d.phase ? [{ id: "dev", name: "本地开发" }] : []),
        ];
        const state = (id) =>
          draft
            ? "pending"
            : id === active
              ? "active"
              : r === "done"
                ? "done"
                : id === "pm" && ["reviewing", "gate", "develop"].includes(r) && !d.standard
                  ? "done"
                  : id === "pm" && ["gate", "develop"].includes(r)
                    ? "done"
                    : id === "tech" && ["gate", "develop"].includes(r)
                      ? "done"
                      : id === "gate" && r === "develop"
                        ? "done"
                        : "pending";
        const stateText = (id) =>
          state(id) === "done"
            ? "已完成"
            : state(id) === "pending"
              ? "待开始"
              : paused
                ? "已暂停"
                : id === "gate"
                  ? "待确认"
                  : id === "pm" && r === "cocreate"
                    ? "待回复"
                    : r === "revising"
                      ? "修订中"
                      : "进行中";
        const completed = items.filter((x) => state(x.id) === "done").length;
        const label = paused
          ? "已暂停"
          : {
              draft: "待确认计划",
              blocked: "能力缺口",
              cocreate: "等你回复",
              revising: "方案修订中",
              reviewing: "方案整理中",
              gate: "等你确认",
              develop: "本地开发中",
              done: "已完成",
            }[r];
        return `<section class="graph-board" aria-label="Graph 状态看板"><div class="graph-board-head"><span class="graph-board-title">${I("branch")}<b>Graph</b><span>${E(d.title)}</span></span><span class="graph-board-summary">${completed}/${items.length} 阶段 <span class="board-status ${paused || ["draft", "blocked", "cocreate", "gate"].includes(r) ? "attention" : ""}">${r === "reviewing" && !d.standard ? "技术审核中" : label}</span></span></div><ol class="graph-board-stages" aria-label="Graph 阶段状态">${items
          .map((x, i) => {
            const st = state(x.id);
            return `<li class="board-stage ${st} ${paused && st === "active" ? "paused" : ""}" ${st === "active" ? 'aria-current="step"' : ""}><span class="board-state-icon">${st === "done" ? I("check") : st === "active" && paused ? I("pause") : "<span></span>"}</span><span class="board-stage-copy"><b>${x.name}</b><small>${stateText(x.id)}</small></span>${i < items.length - 1 ? `<span class="board-edge" aria-hidden="true">${I("chevron")}</span>` : ""}</li>`;
          })
          .join("")}</ol></section>`;
      }

      function standardPlanCard() {
        return planCard();
      }

      function generalThread() {
        return `<div class="conversation"><div class="route-banner between"><span>来自「${planTitle()}」 · 普通工作线程</span><button data-act="to-hub">返回 Hub</button></div><div class="threadtitle"><h2>方案讨论</h2><p>沿用 Hub 默认配置 · ${S.run === "paused" ? "计划已暂停" : "当前工作：" + runLabels[effectiveRun()]}</p></div><div class="message ai">${sender("工作线程", "H")}<div class="body">${S.run === "paused" ? "当前工作已暂停。讨论与修改意见保留，恢复前不会推进计划。" : effectiveRun() === "revising" ? "已收到修改意见，正在原方案上修订。无需重复回答之前的问题。" : S.onlyOne ? "当前只进行讨论，不启动正式执行。" : "按已确认范围整理方案，不自动进入开发。"}</div></div>${revisionNote()}${messageHistory("general")}</div>`;
      }

      function hubConversation() {
        if (S.run === "empty") return welcome();
        if (S.onlyOne)
          return `<div class="conversation collaboration"><div class="route-banner between"><span>专业讨论 · 尚未创建正式执行计划</span><button data-act="start-from-discussion">制定执行计划</button></div><div class="message ai">${sender("Hub", "H")}<div class="body">可以先进入专业线程讨论。<button class="inline-link" data-act="thread:${S.hub.mode === "team" ? "pm" : "general"}">进入对应线程</button></div></div>${messageHistory("hub")}</div>`;
        const cards = flowEntries.filter((e) => e.type === "card"),
          latest = cards[cards.length - 1];
        const first = cards[0]?.snapshot;
        const request = first?.phase
          ? "完善一份产品方案，审核后交给我确认；本次不开发。"
          : "和产品经理完善方案，技术审核后由我确认，再进行本地开发；暂不发布。";
        return `<div class="conversation collaboration flow-conversation"><div class="message user work-request"><div class="bubble">${request}</div></div>${flowEntries
          .map((e) => {
            if (e.type === "card")
              return `<div class="flow-event" data-flow-id="${e.id}">${actionCard(e.snapshot, e === latest, cards[cards.indexOf(e) + 1]?.snapshot)}</div>`;
            if (e.role === "assistant")
              return `<div class="message ai" data-flow-id="${e.id}">${sender("Hub", "H", "模拟回复")}<div class="body">${E(e.text)}</div></div>`;
            return `<div class="message user" data-flow-id="${e.id}">${e.target !== "hub" ? '<div class="flow-reply-context">回复产品经理</div>' : ""}<div class="bubble">${E(e.text)}</div></div>`;
          })
          .join("")}</div>`;
      }

      function threadView() {
        if (S.thread === "general") return generalThread();
        const who = S.thread,
          r = effectiveRun(),
          name = expert(who)?.name || "专家",
          title = { pm: "需求共创", tech: "技术审核", dev: "本地开发" }[who];
        let body = "";
        if (who === "pm")
          body =
            r === "revising"
              ? "已收到本轮修改意见。我会在原方案上修订，不需要你重复回答目标用户。"
              : r === "cocreate"
                ? "首版优先服务个人用户，还是小型团队？这个选择会影响首版范围。"
                : "已提交需求方案，继续在本线程保留讨论与修改记录。";
        else if (who === "tech")
          body =
            S.reviewedRev === S.outputRev
              ? `已审核需求方案 v${S.reviewedRev}：专业审核通过（模拟）。这不是用户放行；下一步仍以计划卡的用户决定为准。`
              : `正在核对需求方案 v${S.outputRev} 的范围、实现成本与权限边界（模拟）。`;
        else
          body = `依据已确认的需求方案 v${S.acceptedRev || S.outputRev}，${r === "done" ? "已模拟完成" : "进行"}本地实现与验证。发布上线不在本次授权范围。`;
        return `<div class="conversation"><div class="route-banner between"><span>计划 v${S.planRev} · ${planTitle()} · ${who === "dev" ? "本地开发" : "方案形成与审核"}${S.run === "paused" ? " · 已暂停" : ""}</span><button data-act="to-hub">返回 Hub</button></div><div class="threadtitle"><h2>${name} · ${title}</h2><p>保留原专业线程历史 · 消息发送给 ${name}</p></div><div class="message ai">${sender(name, expert(who)?.short || "H")}<div class="body">${S.run === "paused" ? (who === "dev" ? "本地开发已暂停。已确认的需求方案 v" + (S.acceptedRev || S.outputRev) + " 与历史工作记录保留，恢复后继续当前阶段。" : who === "tech" ? "技术审核已暂停。原审核对象与已有结论保留，恢复前不继续审核。" : r === "revising" ? "方案修订已暂停。本轮修改意见与原线程记录保留，恢复前不继续修订。" : "需求共创已暂停。原问题与讨论记录保留，消息不会推进计划。") : body}</div></div>${who === "pm" ? revisionNote() : ""}${messageHistory(who)}</div>`;
      }

      function composer() {
        const target = replyTarget(),
          name = target === "hub" ? "Hub" : expert(target)?.name || "工作线程";
        const directed = !S.thread && S.replyTarget;
        const context =
          S.thread || directed
            ? `<div class="composer-context"><span>${directed ? "定向回复" : "当前线程"}：${E(name)} · ${planTitle()} / ${target === "tech" ? "技术审核" : target === "dev" ? "本地开发" : "需求共创"}</span>${directed ? '<button data-act="cancel-directed">取消定向回复</button>' : "<span>沿用原线程</span>"}</div>`
            : '<div class="composer-context"><span>发送给 Hub · 讨论不等于回答专家或批准计划</span></div>';
        return `<div class="composer-wrap">${graphBoard()}${context}<form id="composer" class="composer"><textarea id="chat-input" data-draft-key="${E(draftKey())}" aria-label="发送给${E(name)}" placeholder="${target === "hub" ? "向 Hub 提问或补充想法…" : "回复" + E(name) + "…"}" rows="2">${E(S.drafts[draftKey()] || "")}</textarea><div class="composer-bottom"><div class="row">${ib("plus", "attach-note", "引用资料")}<span class="small">${S.run === "paused" ? "计划已暂停 · 消息只记录，不推进工作" : S.hub.source ? E(S.hub.source) + " 项目背景" : "Hub 共享背景"}</span></div><button class="send" type="submit" aria-label="发送给${E(name)}">${I("up")}</button></div></form></div>`;
      }

      function menu() {
        return S.menu
          ? `<div class="menu"><button data-act="hub-settings">Hub 设置</button><button data-act="save-preset">保存为专家团配置</button><button data-act="${S.run === "paused" ? "resume" : "pause"}">${S.run === "paused" ? "恢复执行" : "暂停当前计划"}</button><button data-act="reset-work">重新演示当前流程</button></div>`
          : "";
      }
      function inspector() {
        if (!S.inspector) return "";
        const [type, revText] = S.inspector.split("@"),
          rev = Number(revText) || S.outputRev,
          snapshot = S.outputs.find((o) => o.revision === rev),
          reviewed = snapshot?.reviewed || S.reviewedRev === rev,
          accepted = snapshot?.accepted || S.acceptedRev === rev,
          phase = phaseOnly();
        const title =
          type === "library"
            ? "成果"
            : type === "plan"
              ? "计划详情"
              : type === "prd"
                ? "需求方案.md"
                : type === "review"
                  ? "技术评审"
                  : "交付摘要";
        let inner = "";
        if (type === "library")
          inner = `<p class="muted small">当前工作成果与历史版本；查看不等于批准。</p>${
            S.outputs.length
              ? S.outputs
                  .slice()
                  .reverse()
                  .map(
                    (o) =>
                      `<button class="doc-link" data-act="artifact:prd@${o.revision}">${I("file")}需求方案 v${o.revision}<span class="muted" style="margin-left:auto">${o.accepted ? "已确认" : o.returned ? "已退回" : "候选版本"}</span></button>${o.reviewed ? `<button class="doc-link" data-act="artifact:review@${o.revision}">${I("file")}技术评审 · 对象：方案 v${o.revision}</button>` : ""}`,
                  )
                  .join("")
              : '<div class="empty-small">尚无正式交付成果。</div>'
          }${effectiveRun() === "done" ? '<button class="doc-link" data-act="artifact:result">交付摘要</button>' : ""}`;
        else if (type === "plan")
          inner = `<span class="tag">计划 v${S.planRev}</span><h2>${planTitle()}</h2>${(S.planNotes[S.planRev] || []).length ? `<h3>本版${effectiveRun() === "draft" ? "草案" : ""}补充要求</h3><ul>${S.planNotes[S.planRev].map((note) => `<li>${E(note)}</li>`).join("")}</ul>` : ""}<p>${phase ? "完成方案形成与审核，由你确认具体版本后完成本次工作。不包含开发。" : "先形成方案、技术审核，再由你确认具体版本后进入本地开发。"}</p><div class="mini-graph"><div class="graphnode current">方案形成与审核<span class="muted">${S.hub.mode === "standard" ? "普通工作线程" : "产品经理 ⇄ 技术审核"}</span></div><span class="g-arrow">↓</span><div class="graphnode gate">用户确认具体方案版本${phase ? "，完成本次委托" : ""}</div>${phase ? "" : '<span class="g-arrow">↓</span><div class="graphnode">本地开发与验证<span class="muted">仅在用户放行后启动</span></div>'}</div><div class="props-row"><span class="muted">授权范围</span><span>${phase ? "仅方案阶段" : "方案与本地开发"}</span></div><div class="props-row"><span class="muted">不包含</span><span>${phase ? "开发、" : ""}发布上线、外部写入</span></div><p class="small">单个模拟计划；未实现真实审批、身份校验或多计划调度。</p>`;
        else if (type === "prd")
          inner = `<span class="tag ${accepted ? "green" : ""}">需求方案 v${rev} · ${accepted ? "用户已确认" : snapshot?.returned ? "已退回修改" : "候选版本"}</span><h2>Linx 个人工作台方案</h2><p class="small">原型演示文档，不代表仓库真实产出。</p><h3>目标</h3><p>帮助个人围绕项目组织工作，通过 Hub 将明确的工作交给专业 Agent。</p><h3>方案范围</h3><ul><li>普通 Hub 与专家团 Hub。</li><li>计划确认、专业共创、审核与用户放行。</li><li>沿用专业线程与成果入口。</li></ul><h3>用户出口</h3><p>${phase ? "确认此版本后完成方案委托，不启动开发。" : "确认此版本后才授权本地开发。"}</p>${snapshot?.feedback ? `<h3>此版本的退回意见</h3><p>${E(snapshot.feedback)}</p>` : ""}`;
        else if (type === "review")
          inner = `<span class="tag ${reviewed ? "green" : ""}">${reviewed ? "专业审核通过（模拟）" : "审核尚未完成"}</span><h2>技术可行性评审</h2><p>审核对象：需求方案 v${rev}。审核结论不代替用户的阶段放行。</p><h3>实施提醒</h3><p>明确本地文件访问边界，避免重复写入。新成果版本必须重新审核和确认。</p>`;
        else
          inner = `<span class="tag green">本次委托完成（模拟）</span><h2>交付摘要</h2><p>需求方案 v${S.acceptedRev || S.outputRev} 与审核记录已保留。${phase ? "本次仅执行方案阶段，没有启动开发。" : "本地开发与验证已模拟完成，没有执行发布。"}</p><div class="hintbox">不连接模型、工作区或真实执行器；此处不代表运行验收。</div>`;
        return `<aside class="inspect" aria-label="${title}"><div class="inspect-head"><h3>${title}</h3>${ib("x", "close-inspector", "关闭详情")}</div><div class="inspect-body">${inner}</div></aside>`;
      }

      function teamList() {
        const data = teams.filter(
          (t) => !t.archived && (!S.search || (t.name + t.purpose).includes(S.search)),
        );
        return `<div class="list-toolbar"><div class="searchbox">${I("search")}<input id="team-search" aria-label="搜索专家团" placeholder="搜索专家团" value="${E(S.search)}"></div><button class="btn primary" data-act="new-team">${I("plus")}新建专家团</button></div><div class="listrows">${data.length ? data.map((t) => `<div class="listitem"><span class="avatar lg">${I("team")}</span><button class="listitem-main" data-act="edit-team:${t.id}"><div class="listitem-title">${E(t.name)} <span class="muted small" style="font-weight:400;margin-left:5px">v${t.revision}</span></div><div class="listitem-desc">${E(t.purpose || "未设置用途")}</div><div class="listitem-members">${t.members.map((id) => `<span>${E(expert(id)?.name || "成员不可用")}</span>`).join("")}</div></button><div class="listitem-buttons"><button class="btn small" data-act="use-team:${t.id}">创建 Hub</button>${ib("copy", "copy-team:" + t.id, "复制专家团")}${ib("archive", "archive-team:" + t.id, "归档专家团")}</div></div>`).join("") : '<div class="empty-small">暂无匹配的专家团。可新建，也可在创建 Hub 时临时选择专家。</div>'}</div><p class="list-note">复用成员与协作偏好，不包含 Hub 对话、项目资料或执行授权。</p>`;
      }
      function singleExperts() {
        return `<div class="list-toolbar"><p class="muted small">沿用已有专家列表与编辑器</p><button class="btn" data-act="expert-editor:new">${I("plus")}新建专家</button></div><div class="listrows">${experts.map((x) => `<div class="listitem"><span class="avatar lg">${x.short}</span><button class="listitem-main" data-act="expert-editor:${x.id}"><div class="listitem-title">${x.name}</div><div class="listitem-desc">${x.desc}</div></button><span class="tag ${x.unavailable ? "amber" : ""}">${x.unavailable || x.skills + " 项技能"}</span>${ib("chevron", "expert-editor:" + x.id, "查看" + x.name)}</div>`).join("")}</div>`;
      }
      function memberOptions(members, prefix = "edit") {
        return experts

        S.modal = "help";
        openDialog(
          `<div class="modal-head"><h2>V0.7 原型评审稿</h2>${ib("x", "close-modal", "关闭")}</div><div class="modal-body stack"><p class="small muted">保留 V0.4 创建与专家配置流程，集中优化一份工作从共创、修订到确认的体验。不调用 Agent，不接真实 API。</p><div class="help-grid"><div><h3>回复对象明确</h3><p>Hub 默认接收普通讨论；“去回答”进入原线程，“在此回复”明确选择产品经理。草稿分别保留，取消定向回复不丢内容。</p></div><div><h3>状态与消息分离</h3><p>输入框上方只展示 Graph 阶段状态，不提供业务操作。回复、查看成果、确认、退回与暂停均在消息卡中完成。已处理卡片保留原内容与处理回执，新阶段追加新卡。浏览历史时不强制滚到底部。</p></div><div><h3>修订不重新提问</h3><p>退回意见进入原作者线程，显示正在修订；完成后重新审核、重新确认具体版本。</p></div><div><h3>暂停保留进度</h3><p>暂停是当前进度的覆盖状态，保留线程、成果与开发阶段。普通聊天不会推进计划。</p></div></div><h3>建议体验</h3><p class="small">确认计划 → 在 Hub 提问（计划不推进）→ 在此回复或去回答 → 底部模拟审核与待放行 → 退回修改 → 模拟新版本审核 → 确认。开发中暂停，再检查线程与成果是否仍在。</p><h3>范围与版本</h3><p class="small">计划版本、方案版本分别显示；审核对象对应方案版本。仅授权方案时，确认只完成方案，不进入开发。</p><h3>演示限制</h3><p class="small">仍只有一份模拟计划，未实现多计划调度、真实审批身份、后端去重、权限与持久化契约。底部状态切换是演示事件，不属于正式产品，也不代表真实审核或执行结果。未连接仓库或生产数据。</p><h3>本地数据</h3><p class="small">专家团使用独立存储 hub-v07-teams，不覆盖 V0.4 预设。聊天草稿、工作和历史成果仅保留在本次页面内存中；刷新会重置。</p><div class="row" style="padding-bottom:16px"><button class="btn" data-act="reset-presets">恢复示例专家团</button><button class="btn primary" data-act="close-modal">开始体验</button></div></div>`,
        );
      }

      function adjust() {
        S.modal = "adjust";
        openDialog(
          `<div class="modal-head"><h2>调整计划</h2>${ib("x", "close-modal", "关闭")}</div><div class="modal-body"><div class="field"><label>执行范围</label><select id="plan-scope"><option value="all" ${S.scope === "all" ? "selected" : ""}>方案确认后，继续本地开发</option><option value="phase" ${S.scope === "phase" ? "selected" : ""}>本次只完成方案阶段</option></select></div><div class="field"><label for="plan-adjustment">补充要求</label><textarea id="plan-adjustment" placeholder="例如：先聚焦个人使用，不做多人协作。"></textarea></div><p class="muted small" style="margin:0 0 17px">生成新版草案后重新确认。不会直接改写已获授权的执行范围。</p></div><div class="modal-footer"><span class="small">当前计划 v${S.planRev}</span><button class="btn primary" data-act="submit-adjust">生成新版计划</button></div>`,
        );
      }
      function expertEditor(id) {
        let x = expert(id);
        S.modal = "expert";
        openDialog(
          `<div class="modal-head"><h2>${x ? x.name : "新建专家"}</h2>${ib("x", "close-modal", "关闭")}</div><div class="modal-body"><p class="muted small" style="margin-bottom:18px">此处衔接仓库已有 ExpertEditor，本轮不另建一套编辑器。</p><div class="tabs"><button class="active">基本信息</button><button disabled>技能</button><button disabled>资料</button><button disabled>工具</button></div><div class="subtle"><label class="label">角色与工作方式</label><p class="small">${x ? x.desc : "定义专业角色、工作方法与能力。"}</p></div><p class="muted small" style="margin:16px 0 24px">专家能力由原编辑器维护；专家团只引用 Expert ID。这里仅演示入口边界。</p></div><div class="modal-footer"><span class="small">现有能力示意 · 此处不保存</span><button class="btn" data-act="close-modal">返回</button></div>`,
        );
      }
      function bindForms() {
        document.getElementById("chat-input")?.addEventListener("input", stashDraft);
        document.getElementById("composer")?.addEventListener("submit", (e) => {
          e.preventDefault();
          sendMessage();
        });
        document.getElementById("chat-input")?.addEventListener("keydown", (e) => {
          if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
            e.preventDefault();
            sendMessage();
          }
        });
        document
          .getElementById("return-text")
          ?.addEventListener("input", (e) => (S.returnText = e.target.value));
        document.getElementById("team-search")?.addEventListener("input", (e) => {
          let pos = e.target.selectionStart;
          S.search = e.target.value;
          render();
          let inp = document.getElementById("team-search");
          inp.focus();
          inp.setSelectionRange(pos, pos);
        });
        if (S.editor) {
          for (let [id, key] of [
            ["team-name", "name"],
            ["team-purpose", "purpose"],
          ])
            document.getElementById(id)?.addEventListener("input", (e) => {
              S.editor[key] = e.target.value;
              editorDirty = true;
            });
          document.querySelectorAll('[data-members="edit"]').forEach((c) =>
            c.addEventListener("change", () => {
              S.editor.members = [
                ...document.querySelectorAll('[data-members="edit"]:checked'),
              ].map((x) => x.value);
              editorDirty = true;
              document.getElementById("member-count").textContent = S.editor.members.length + " 位";
            }),
          );
          document.querySelectorAll("[data-template]").forEach((c) =>
            c.addEventListener("change", () => {
              S.editor.templates = [...document.querySelectorAll("[data-template]:checked")].map(
                (x) => x.dataset.template,
              );
              editorDirty = true;
            }),
          );
        }
      }
      function sendMessage() {
        S.lastFlowAction = "send-message";
        const input = document.getElementById("chat-input");
        if (!input?.value.trim()) return;
        const text = input.value.trim(),
          target = replyTarget();
        S.drafts[input.dataset.draftKey] = "";
        input.value = "";
        S.messages.push({ target, role: "user", text });
        if (S.run === "paused") {
          S.messages.push({
            target,
            role: "assistant",
            text: "已记录。当前计划暂停中，这条消息不会继续执行或放行阶段。",
          });
          render();
          return;
        }
        if (S.run === "empty" && target === "hub") {
          if (text.includes("讨论") && !text.includes("审核") && !text.includes("开发")) {
            S.run = "cocreate";
            S.onlyOne = true;
            ensureThreads("cocreate");
            render();
            toast("已进入讨论，没有授权后续执行。");
            return;
          }
          S.onlyOne = false;
          S.run = "draft";
          S.expanded = false;
          render();
          return;
        }
        if (target === "pm" && S.run === "cocreate") {
          if (S.onlyOne) {
            S.messages.push({
              target,
              role: "assistant",
              text: "已记录你的补充，我们继续讨论，未启动正式执行。",
            });
            render();
            return;
          }
          S.run = "reviewing";
          S.replyTarget = null;
          S.reviewedRev = null;
          recordOutput();
          ensureThreads("reviewing");
          S.expanded = false;
          S.messages.push({
            target,
            role: "assistant",
            text: "已收到必要输入，整理为需求方案 v" + S.outputRev + " 并送交技术审核（模拟）。",
          });
          render();
          toast("回答已进入原产品经理线程；模拟进入技术审核。");
          return;
        }
        S.messages.push({
          target,
          role: "assistant",
          text:
            target === "hub"
              ? "已收到。我会保留这条讨论，当前工作阶段保持不变。需要回答专家时，请选择工作卡上的“去回答”或“在此回复”。"
              : "已记录补充意见。此消息不改变计划范围或阶段放行状态。",
        });
        render();
      }

      function saveTeam() {
        const t = S.editor;
        let error = !t.name.trim()
          ? "请填写专家团名称。"
          : !t.members.length
            ? "至少选择一位专家。"
            : "";
        if (error) {
          document.getElementById("team-error").textContent = error;
          return;
        }
        if (t.id) {
          teams = teams.map((x) =>
            x.id === t.id ? { ...t, name: t.name.trim(), revision: x.revision + 1 } : x,
          );
        } else teams.push({ ...t, id: "team-" + Date.now(), name: t.name.trim(), revision: 1 });
        saveTeams();
        S.editor = null;
        S.search = "";
        editorDirty = false;
        render();
        toast("专家团已保存；已有 Hub 保持原配置。");
      }
      function useTeam(id) {
        S.page = "hub";
        S.editor = null;
        render();
        createModal(id);
      }
      function resetWorkState() {
        S.planNotes = {};
        S.replyTarget = null;
        S.messages = [];
        S.createdThreads = [];
        S.outputs = [];
        S.reviewedRev = null;
        S.acceptedRev = null;
        S.pausedFrom = null;
        S.expanded = false;
        S.returning = false;
        S.returnText = "";
        S.stageReplies = [];
        S.threadMsgs = [];
      }
      function demoState(k, reset = false) {
        stashDraft();
        closeDialog();
        S.page = "hub";
        S.inspector = null;
        S.returning = false;
        S.onlyOne = false;
        if (reset) {
          resetWorkState();
          S.thread = null;
          S.newHub = false;
          S.scope = "all";
          S.planRev = 1;
          S.outputRev = 2;
          S.hubId = "demo";
          S.hub = {
            name: "Linx 产品方案",
            mode: "team",
            purpose: defaults[0].purpose,
            members: ["pm", "tech", "dev"],
            source: "Linx",
            teamId: "product",
            teamRevision: 1,
            templates: ["方案共创与评审"],
          };
        }
        if (k === "develop" && phaseOnly()) {
          toast("本次未授权开发。请调整计划并重新确认范围。");
          return;
        }
        if (k === "revising" && !S.returnText) {
          S.returnText = "首版先聚焦个人工作台，移除多人协作。";
          recordOutput({ reviewed: true, returned: true, feedback: S.returnText });
          S.outputRev++;
          S.reviewedRev = null;
          S.acceptedRev = null;
        }
        if (["reviewing", "gate", "develop", "done"].includes(k)) recordOutput();
        if (["gate", "develop", "done"].includes(k)) {
          S.reviewedRev = S.hub.mode === "team" ? S.outputRev : null;
          recordOutput({ reviewed: S.hub.mode === "team" });
        }
        if (["develop", "done"].includes(k)) {
          S.acceptedRev = S.outputRev;
          recordOutput({ accepted: true });
        }
        if (["cocreate", "revising", "reviewing"].includes(k)) {
          S.reviewedRev = null;
          S.acceptedRev = null;
        }
        ensureThreads(k);
        S.run = k;
        S.pausedFrom = null;
        S.expanded = false;
        render();
      }

      function leaveEditor(next) {
        if (S.editor && editorDirty) {
          S.modal = "unsaved";
          openDialog(
            `<div class="modal-head"><h2>保存当前更改？</h2></div><div class="modal-body"><p class="muted small" style="margin-bottom:20px">当前专家团还未保存。</p></div><div class="modal-footer"><button class="btn ghost" data-act="close-modal">继续编辑</button><button class="btn" data-act="discard-editor:${next}">放弃更改</button></div>`,
          );
          return false;
        }
        return true;
      }
      function act(action) {
        S.lastFlowAction = action.split(":")[0];
        stashDraft();
        const [k, ...parts] = action.split(":");
        let v = parts.join(":");
        switch (k) {
          case "jump-latest": {
            const body = document.querySelector(".hubbody");
            if (body) {
              body.scrollTop = body.scrollHeight;
              updateFlowJump();
            }
            break;
          }
          case "close-modal":
            closeDialog();
            break;
          case "scope-note":
            toast("此入口沿用现有产品，不在本轮原型范围。");
            break;
          case "existing-setting":
            toast("「" + v + "」保留现有设置；本原型聚焦专家与 Hub。");
            break;
          case "help":
            help();
            break;
          case "create":
          case "demo-create":
            if (!leaveEditor("create")) break;
            S.page = "hub";
            render();
            createModal();
            break;
          case "create-mode":
            syncCreate();
            createDraft.mode = v;
            if (v === "team" && !createDraft.teamId && !createDraft.members.length) {
              let t = teams.find((x) => !x.archived);
              if (t) {
                createDraft.teamId = t.id;
                createDraft.teamRevision = t.revision;
                createDraft.members = [...t.members];
                createDraft.templates = [...t.templates];
                createDraft.purpose = t.purpose;
              }
            }
            createModal(null, true);
            break;
          case "toggle-create-picker":
            syncCreate();
            createDraft.picker = !createDraft.picker;
            createModal(null, true);
            break;
          case "submit-create":
            submitCreate();
            break;
          case "settings-teams":
            if (!leaveEditor("settings")) break;
            closeDialog();
            S.page = "settings";
            S.tab = "teams";
            S.thread = null;
            S.editor = null;
            S.inspector = null;
            S.menu = false;
            render();
            break;
          case "tab":
            if (!leaveEditor("settings")) break;
            S.tab = v;
            S.search = "";
            S.editor = null;
            render();
            break;
          case "new-team":
            S.editor = { id: null, name: "", purpose: "", members: [], templates: [], revision: 0 };
            editorDirty = false;
            render();
            document.getElementById("team-name")?.focus();
            break;
          case "edit-team":
            S.editor = structuredClone(teams.find((x) => x.id === v));
            editorDirty = false;
            render();
            break;
          case "save-team":
            saveTeam();
            break;
          case "back-teams":
            if (!leaveEditor("settings")) break;
            S.editor = null;
            render();
            break;
          case "discard-editor":
            closeDialog();
            S.editor = null;
            editorDirty = false;
            if (v === "hub") {
              S.page = "hub";
              render();
            } else if (v === "create") {
              S.page = "hub";
              render();
              createModal();
            } else {
              S.page = "settings";
              S.tab = "teams";
              render();
            }
            break;
          case "use-team":
            useTeam(v);
            break;
          case "copy-team": {
            let t = teams.find((x) => x.id === v);
            S.editor = { ...structuredClone(t), id: null, name: t.name + " 副本", revision: 0 };
            editorDirty = true;
            render();
            break;
          }
          case "archive-team":
            S.modal = "archive";
            openDialog(
              `<div class="modal-head"><h2>归档这份专家团配置？</h2></div><div class="modal-body"><p class="muted small" style="margin-bottom:20px">不再用于新建 Hub。已经创建的 Hub、线程和成果不受影响。</p></div><div class="modal-footer"><button class="btn ghost" data-act="close-modal">取消</button><button class="btn primary" data-act="confirm-archive:${v}">归档配置</button></div>`,
            );
            break;
          case "confirm-archive":
            teams = teams.map((t) => (t.id === v ? { ...t, archived: true } : t));
            saveTeams();
            closeDialog();
            render();
            toast("配置已归档，已有 Hub 不受影响。");
            break;
          case "reset-presets":
            teams = structuredClone(defaults);
            saveTeams();
            closeDialog();
            render();
            toast("示例专家团已恢复。");
            break;
          case "expert-editor":
            expertEditor(v);
            break;
          case "reply-here":
            if (S.run !== "cocreate" || v !== "pm") break;
            S.replyTarget = "pm";
            S.thread = null;
            render();
            document.getElementById("chat-input")?.focus();
            break;
          case "cancel-directed":
            S.replyTarget = null;
            render();
            break;
          case "to-hub":
            if (!leaveEditor("hub")) break;
            S.replyTarget = null;
            S.page = "hub";
            S.thread = null;
            S.editor = null;
            S.menu = false;
            render();
            break;
          case "ordinary-hub":
            resetWorkState();
            S.hubId = "ordinary";
            S.hub = {
              name: "日常工作",
              mode: "standard",
              purpose: "",
              members: [],
              source: "",
              teamId: "",
              templates: [],
            };
            S.run = "empty";
            S.page = "hub";
            S.thread = null;
            S.inspector = null;
            render();
            break;
          case "demo-work":
            demoState("draft", true);
            break;
          case "demo-state":
            if (!leaveEditor("hub")) break;
            demoState(v);
            break;
          case "suggest": {
            let input = document.getElementById("chat-input");
            input.value =
              v === "discussion"
                ? "我们先讨论一下这个产品的定位。"
                : "和产品经理完善方案，请技术专家审核，我确认后再开发。";
            stashDraft();
            input.focus();
            break;
          }
          case "start-from-discussion":
            S.onlyOne = false;
            S.thread = null;
            S.run = "draft";
            render();
            break;
          case "confirm-plan": {
            if (S.run !== "draft") {
              toast("计划状态已变化，请查看当前版本。");
              break;
            }
            if (
              S.hub.mode === "team" &&
              ((S.scope === "phase" ? ["pm", "tech"] : ["pm", "tech", "dev"]).some(
                (id) => !S.hub.members.includes(id),
              ) ||
                S.hub.members.some((id) => expert(id)?.unavailable))
            ) {
              S.run = "blocked";
              render();
              break;
            }
            S.onlyOne = false;
            S.run = S.hub.mode === "team" ? "cocreate" : "reviewing";
            ensureThreads(S.run);
            S.replyTarget = null;
            S.expanded = false;
            render();
            toast("计划 v" + S.planRev + " 已确认。留在 Hub，不自动跳转。");
            break;
          }
          case "expand-stage":
            S.expanded = !S.expanded;
            render();
            break;
          case "thread":
            if (!S.createdThreads.includes(v)) {
              toast("该专业线程尚未创建。先完成必要输入或阶段放行。");
              break;
            }
            S.replyTarget = null;
            S.thread = v;
            S.inspector = null;
            render();
            break;
          case "plan-details":
            S.inspector = "plan";
            render();
            break;
          case "artifact":
            S.inspector = v;
            render();
            break;
          case "library":
            S.inspector = S.inspector === "library" ? null : "library";
            render();
            break;
          case "close-inspector":
            S.inspector = null;
            render();
            break;
          case "approve-gate":
            if (S.run !== "gate") {
              toast("确认对象已变化，请刷新当前方案。");
              break;
            }
            S.acceptedRev = S.outputRev;
            recordOutput({ accepted: true });
            S.run = phaseOnly() ? "done" : "develop";
            ensureThreads(S.run);
            S.expanded = false;
            S.returning = false;
            render();
            toast(
              "已确认需求方案 v" +
                S.outputRev +
                "；" +
                (S.scope === "phase" || S.hub.mode === "standard"
                  ? "本次委托完成。"
                  : "开发阶段已获放行。"),
            );
            break;
          case "return-gate":
            if (S.run !== "gate") break;
            S.returning = true;
            S.returnText = "";
            render();
            document.getElementById("return-text")?.focus();
            break;
          case "cancel-return":
            S.returning = false;
            render();
            break;
          case "send-return":
            if (S.run !== "gate") break;
            if (!S.returnText.trim()) {
              toast("请填写需要修改的内容。");
              break;
            }
            S.returning = false;
            recordOutput({ returned: true, feedback: S.returnText });
            S.outputRev++;
            S.reviewedRev = null;
            S.acceptedRev = null;
            S.replyTarget = null;
            S.run = "revising";
            S.expanded = false;
            S.messages.push({
              target: S.hub.mode === "team" ? "pm" : "general",
              role: "user",
              text: "退回修改：" + S.returnText,
            });
            render();
            toast("修改意见已发回原线程，新版本需重新审核和确认。");
            break;
          case "adjust-plan":
            adjust();
            break;
          case "submit-adjust": {
            S.scope = document.getElementById("plan-scope").value;
            let txt = document.getElementById("plan-adjustment").value.trim();
            const notes = [...(S.planNotes[S.planRev] || [])];
            if (txt && !notes.includes(txt)) notes.push(txt);
            S.planRev++;
            S.planNotes[S.planRev] = notes;
            S.run = "draft";
            S.thread = null;
            S.replyTarget = null;
            S.expanded = false;
            closeDialog();
            render();
            toast("已形成新版草案，等待你重新确认。");
            break;
          }
          case "hub-menu":
            S.menu = !S.menu;
            render();
            break;
          case "hub-settings":
            S.menu = false;
            render();
            openInstance();
            break;
          case "hub-members":
            openInstance("experts");
            break;
          case "instance-tab":
            syncInstance();
            openInstance(v, true);
            break;
          case "switch-instance-mode":
            syncInstance();
            if (!["empty", "draft", "done"].includes(S.run)) {
              toast("请先完成或取消当前计划，再切换模式。");
              break;
            }
            instanceDraft.mode = instanceDraft.mode === "team" ? "standard" : "team";
            if (instanceDraft.mode === "team" && !instanceDraft.members.length)
              instanceDraft.members = ["pm"];
            openInstance("general", true);
            break;
          case "save-instance": {
            syncInstance();
            if (!instanceDraft.name.trim()) {
              document.getElementById("instance-error").textContent = "请填写 Hub 名称。";
              break;
            }
            if (instanceDraft.mode === "team" && !instanceDraft.members.length) {
              document.getElementById("instance-error").textContent =
                "专家团模式至少保留一位专家。";
              break;
            }
            S.hub = { ...instanceDraft, name: instanceDraft.name.trim() };
            closeDialog();
            render();
            toast("已保存当前 Hub 配置，不改写已经确认的计划。");
            break;
          }
          case "save-instance-preset":
            syncInstance();
            closeDialog();
            S.page = "settings";
            S.tab = "teams";
            S.editor = {
              id: null,
              name: instanceDraft.name + " 配置",
              purpose: instanceDraft.purpose,
              members: [...instanceDraft.members],
              templates: [...(instanceDraft.templates || [])],
              revision: 0,
            };
            editorDirty = true;
            render();
            break;
          case "save-preset":
            if (!S.hub.members.length) {
              toast("当前没有参与专家。先在 Hub 设置中选择成员。");
              break;
            }
            S.page = "settings";
            S.tab = "teams";
            S.menu = false;
            S.editor = {
              id: null,
              name: S.hub.name + " 配置",
              purpose: S.hub.purpose,
              members: [...S.hub.members],
              templates: [...(S.hub.templates || [])],
              revision: 0,
            };
            editorDirty = true;
            render();
            break;
          case "pause":
            if (["empty", "draft", "done", "paused"].includes(S.run)) {
              toast("当前没有可暂停的执行计划。");
              S.menu = false;
              render();
              break;
            }
            S.pausedFrom = S.run;
            S.run = "paused";
            S.menu = false;
            render();
            break;
          case "resume":
            if (S.run !== "paused") break;
            S.run = S.pausedFrom || "reviewing";
            S.pausedFrom = null;
            S.menu = false;
            render();
            break;
          case "reset-work":
            resetWorkState();
            S.run = "draft";
            S.thread = null;
            S.inspector = null;
            S.menu = false;
            S.stageReplies = [];
            S.returnText = "";
            S.threadMsgs = [];
            S.returning = false;
            S.onlyOne = false;
            render();
            break;
          case "attach-note":
            toast("沿用现有消息引用、文件附件与成果引用入口。");
            break;
          default:
            toast("该入口属于已有产品能力，不在此原型中改造。");
        }
      }
      document.addEventListener("click", (e) => {
        const b = e.target.closest("[data-act]");
        if (b && !b.disabled) {
          e.preventDefault();
          act(b.dataset.act);
        }
      });
      document.addEventListener("keydown", (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === "s" && S.editor) {
          e.preventDefault();
          saveTeam();
        }
      });
      window.addEventListener("beforeunload", (e) => {
        if (editorDirty) {
          e.preventDefault();
          e.returnValue = "";
        }
      });
      render();
    </script>
  </body>
</html>
