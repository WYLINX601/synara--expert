name: Qualify Linx macOS arm64
on:
  workflow_call:
    inputs:
      runner: { required: true, type: string }
      platform: { required: true, type: string }
      arch: { required: true, type: string }
      target: { required: true, type: string }
      version: { required: true, type: string }
      desktop_flavor: { required: true, type: string }
      publish_release: { required: true, type: boolean }
      source_commit: { required: true, type: string }
      source_tag: { required: true, type: string }
      lockfile_sha256: { required: true, type: string }
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Enforce the only release lane
        env:
          PLATFORM: ${{ inputs.platform }}
          ARCH: ${{ inputs.arch }}
          FLAVOR: ${{ inputs.desktop_flavor }}
          TARGET: ${{ inputs.target }}
        run: test "$PLATFORM/$ARCH/$FLAVOR/$TARGET" = mac/arm64/workbench/dmg
      - name: Locate same-run failed qualification checkpoint
        id: checkpoint
        if: github.run_attempt > 1
        uses: actions/github-script@v8
        with:
          script: |
            const assets = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, { ...context.repo, run_id: context.runId, per_page: 100 });
            const matches = assets.filter(a => a.name === 'candidate-desktop-mac-arm64' && !a.expired);
            if (matches.length > 1) throw new Error('Ambiguous checkpoint');
            core.setOutput('id', matches[0]?.id ?? '');
      - uses: actions/download-artifact@v8
        if: steps.checkpoint.outputs.id != ''
        with:
          artifact-ids: ${{ steps.checkpoint.outputs.id }}
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          path: release-publish
      - name: Verify checkpoint binding and immutable bytes
        if: steps.checkpoint.outputs.id != ''
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          SOURCE_TAG: ${{ inputs.source_tag }}
          LOCK: ${{ inputs.lockfile_sha256 }}
          PUBLICATION: ${{ inputs.publish_release }}
        run: node scripts/verify-release-artifact-checkpoint.ts --assets-dir release-publish --platform mac --arch arm64 --target dmg --flavor workbench --version "$VERSION" --source-commit "$SOURCE_COMMIT" --source-tag "$SOURCE_TAG" --lockfile-sha256 "$LOCK" --publication "$PUBLICATION" --allow-unsigned-windows-publication false
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile --ignore-scripts --filter '!@synara/marketing'
      - uses: actions/download-artifact@v8
        if: steps.checkpoint.outputs.id == ''
        with:
          name: mac-icon-catalog
          path: ${{ runner.temp }}/mac-icon
      - name: Select pinned native toolchain
        if: steps.checkpoint.outputs.id == ''
        run: |
          test -d /Applications/Xcode_16.4.app/Contents/Developer
          echo 'DEVELOPER_DIR=/Applications/Xcode_16.4.app/Contents/Developer' >> "$GITHUB_ENV"
          echo "SYNARA_MAC_ICON_CATALOG=$RUNNER_TEMP/mac-icon/Assets.car" >> "$GITHUB_ENV"
      - uses: ./.github/actions/provision-cua
        if: steps.checkpoint.outputs.id == ''
        with:
          arch: arm64
          prepared-artifact: prepared-cua-mac-arm64
      - uses: ./.github/actions/restore-portable-build
        if: steps.checkpoint.outputs.id == ''
        with:
          source-commit: ${{ inputs.source_commit }}
      - name: Build ad-hoc sealed Linx DMG and ZIP with embedded public trust
        if: steps.checkpoint.outputs.id == ''
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          VERSION: ${{ inputs.version }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          SOURCE_TAG: ${{ inputs.source_tag }}
          LOCK: ${{ inputs.lockfile_sha256 }}
        run: |
          args=(--platform mac --target dmg --arch arm64 --flavor workbench --build-version "$VERSION" --source-commit "$SOURCE_COMMIT" --lockfile-sha256 "$LOCK" --output-dir release --skip-build --verbose)
          if [[ -n "$SOURCE_TAG" ]]; then args+=(--source-tag "$SOURCE_TAG"); fi
          node scripts/build-desktop-artifact.ts "${args[@]}"
          mkdir -p release-publish
          cp release/*.dmg release/*.zip release-publish/
      - name: Structurally qualify both containers and write provenance
        id: provenance
        if: steps.checkpoint.outputs.id == ''
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          SOURCE_TAG: ${{ inputs.source_tag }}
          LOCK: ${{ inputs.lockfile_sha256 }}
          PUBLICATION: ${{ inputs.publish_release }}
        run: bun scripts/write-release-artifact-provenance.ts --assets-dir release-publish --platform mac --arch arm64 --target dmg --version "$VERSION" --source-commit "$SOURCE_COMMIT" --source-tag "$SOURCE_TAG" --lockfile-sha256 "$LOCK" --publication "$PUBLICATION" --signed false --ad-hoc true --allow-unsigned-windows-publication false
      - name: Smoke packaged desktop startup with isolated data
        run: node scripts/verify-packaged-desktop-startup.ts --assets-dir release-publish --platform mac --arch arm64 --version '${{ inputs.version }}' --desktop-flavor workbench --executable-name linx
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-mac-arm64
          path: release-publish/*
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - name: Reverify failed qualification checkpoint
        id: preserve
        if: failure() && steps.provenance.outcome == 'success'
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          SOURCE_TAG: ${{ inputs.source_tag }}
          LOCK: ${{ inputs.lockfile_sha256 }}
          PUBLICATION: ${{ inputs.publish_release }}
        run: node scripts/verify-release-artifact-checkpoint.ts --assets-dir release-publish --platform mac --arch arm64 --target dmg --flavor workbench --version "$VERSION" --source-commit "$SOURCE_COMMIT" --source-tag "$SOURCE_TAG" --lockfile-sha256 "$LOCK" --publication "$PUBLICATION" --allow-unsigned-windows-publication false
      - uses: actions/upload-artifact@v7
        if: failure() && steps.preserve.outcome == 'success'
        with:
          name: candidate-desktop-mac-arm64
          path: release-publish/*
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
